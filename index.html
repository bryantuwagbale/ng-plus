<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>New Gains+</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"New Gains%2B","short_name":"NG%2B","display":"standalone","background_color":"%230E1116","theme_color":"%230E1116","start_url":"."}'>
<style>
:root{
  --bg:#080A0E;
  --bone:#F2F4F7; --ash:#9AA4B2; --dim:#69737F;
  --gold:#D9B23C; --goldsoft:#F0CE63; --jade:#5FB489; --blood:#D9605C; --flask:#61A5E8;
  --glass:rgba(255,255,255,.055);
  --glass2:rgba(255,255,255,.09);
  --edge:rgba(255,255,255,.11);
  --edge-top:rgba(255,255,255,.20);
  --blur:saturate(180%) blur(26px);
  --r:22px; --r-in:15px;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{
  margin:0;color:var(--bone);overscroll-behavior:contain;font-family:var(--sans);font-size:15px;line-height:1.35;
  background:var(--bg);overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
/* ambient field: gives the glass something to refract */
body::before{
  content:"";position:fixed;inset:0 -20% -20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 38% at 18% 8%, rgba(217,178,60,.20), transparent 70%),
    radial-gradient(45% 40% at 88% 22%, rgba(97,165,232,.16), transparent 70%),
    radial-gradient(60% 45% at 50% 108%, rgba(95,180,137,.14), transparent 70%);
  filter:blur(30px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:12px 13px calc(88px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block}
.view.slide{animation:slide .34s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{opacity:0;transform:translateX(calc(var(--dir,1) * 16px))}to{opacity:1;transform:none}}

/* ---- type ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h2{margin:8px 4px 3px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);color:var(--ash);font-weight:500}
h2:first-child{margin-top:2px}

/* ---- glass primitive ---- */
.card,.sheet,nav,.cal button,.btn,input,select,textarea{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.card{
  background:var(--glass);border:.5px solid var(--edge);border-radius:var(--r);
  padding:9px 12px;margin-bottom:5px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 var(--edge-top) inset,0 8px 26px rgba(0,0,0,.32);
  transition:background .4s ease,border-color .4s ease,box-shadow .3s ease;
}
.card:has(.row:active){box-shadow:0 1px 0 var(--edge-top) inset,0 6px 18px rgba(0,0,0,.36)}
.card.weighed{background:linear-gradient(180deg,rgba(95,180,137,.10),rgba(255,255,255,.05) 70%);border-color:rgba(95,180,137,.26)}
.card.floor.done{background:linear-gradient(180deg,rgba(95,180,137,.16),rgba(255,255,255,.05) 70%);border-color:rgba(95,180,137,.34)}

/* ---- readout ---- */
.readout{padding:0 4px 5px;margin-bottom:0}
.rune-line{display:flex;align-items:baseline;gap:9px}
.rune-big{font-family:var(--mono);font-size:30px;transition:filter .3s ease;line-height:1;font-weight:600;letter-spacing:-.045em;
  background:linear-gradient(180deg,#F6DE93,#C99B22);-webkit-background-clip:text;background-clip:text;color:transparent}
.rune-unit{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ceil{display:flex;gap:3px;margin-top:4px}
.ceil i{flex:1;height:3px;background:rgba(255,255,255,.10);border-radius:3px;
  transition:background .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
.ceil i.f{background:var(--gold);box-shadow:0 0 10px rgba(217,178,60,.5)}
.ceil i.l{background:var(--goldsoft);box-shadow:0 0 10px rgba(240,206,99,.55)}
.meta{display:flex;gap:6px;margin-top:7px;padding-top:6px;border-top:.5px solid var(--edge)}
.meta div{flex:1;min-width:0}
.meta .v{font-family:var(--mono);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--jade)}.bad{color:var(--blood)}.gold{color:var(--gold)}.blue{color:var(--flask)}

.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.hdr .st{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ash);white-space:nowrap}

/* ---- rows ---- */
.row{display:flex;align-items:center;gap:11px;padding:4px 2px;border-top:.5px solid var(--edge);width:100%;text-align:left}
.row:first-of-type{border-top:none}
.box{width:22px;height:22px;flex:0 0 22px;border:1.5px solid rgba(255,255,255,.26);border-radius:8px;position:relative;
  background:rgba(255,255,255,.05);
  transition:transform .34s cubic-bezier(.34,1.56,.44,1),background .22s ease,border-color .22s ease}
.box::after{opacity:0;transform:rotate(42deg) scale(.4);
  transition:opacity .16s ease .04s,transform .3s cubic-bezier(.34,1.7,.44,1) .04s}
.row.on .box,.gi.on .box{background:var(--jade);border-color:rgba(255,255,255,.5);transform:scale(1.08)}
.row.on .box::after,.gi.on .box::after{opacity:1;transform:rotate(42deg) scale(1)}
.box::after{content:"";position:absolute;left:7px;top:3.5px;width:4px;height:10px;
  border:solid #08120D;border-width:0 2.2px 2.2px 0}
.row .lbl{flex:1;min-width:0}
.row .sub{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.row .val{font-family:var(--mono);font-size:12px;color:var(--dim);transition:color .3s ease}
.row{transition:background .25s ease;border-radius:10px}
.row:active{background:rgba(255,255,255,.05)}
.row.on .val{color:var(--gold)}

.row:disabled{opacity:.4}

/* ---- controls ---- */
.btn{display:block;width:100%;padding:11px;border:.5px solid var(--edge);border-radius:var(--r-in);
  background:var(--glass2);box-shadow:0 1px 0 var(--edge-top) inset;
  font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-top:9px}
.btn{transition:transform .24s cubic-bezier(.34,1.5,.44,1),background .25s ease,border-color .25s ease,opacity .25s}
.btn:active{transform:scale(.96)}
.btn.gold{border-color:rgba(217,178,60,.4);color:var(--goldsoft);background:rgba(217,178,60,.14)}
.btn.sm{width:auto;padding:8px 13px;margin:0;font-size:11px;border-radius:12px}
.btn:disabled{opacity:.3}
.split{display:flex;gap:9px}.split>*{flex:1}
input[type=text],input[type=number],select,textarea{
  width:100%;background:rgba(255,255,255,.06);border:.5px solid var(--edge);border-radius:12px;padding:9px 11px;font-size:16px}
input::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--goldsoft);outline-offset:2px}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.35}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:.5px solid var(--edge);font-size:14px}
.kv:first-child{border-top:none}
.kv .n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .sub{font-size:11.5px}

/* ---- floating glass tab bar ---- */
nav{
  position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:496px;margin:0 auto;display:flex;
  background:rgba(15,19,26,.86);border:.5px solid var(--edge);border-radius:28px;padding:5px;
  box-shadow:0 1px 0 var(--edge-top) inset,0 10px 34px rgba(0,0,0,.5);z-index:10;
}
nav button{flex:1;padding:7px 1px 6px;border-radius:23px;font-family:var(--mono);font-size:8px;
  letter-spacing:.01em;text-transform:uppercase;color:var(--dim);position:relative;z-index:1;
  transition:color .28s ease,transform .3s cubic-bezier(.34,1.4,.44,1)}
nav button span{display:block;font-size:15px;line-height:1;margin-bottom:3px;opacity:.5}
nav button.on{color:#0A0C10}
#pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:23px;
  background:linear-gradient(180deg,#F0CE63,#C99B22);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 14px rgba(217,178,60,.35);
  transition:transform .42s cubic-bezier(.32,1.28,.38,1)}
nav button.on span{opacity:1}
nav button:active{transform:scale(.93)}

/* ---- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-family:var(--mono);font-size:9px;color:var(--dim);padding-bottom:3px}
.cal button{aspect-ratio:1;border:.5px solid var(--edge);border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--glass);font-family:var(--mono);gap:1px;
  transition:background .35s ease,border-color .35s ease,transform .24s cubic-bezier(.34,1.5,.44,1)}
.cal button:active{transform:scale(.9)}
.cal button.pad{border:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.cal button .d{font-size:11px;color:var(--ash)}
.cal button .r{font-size:9px;color:var(--dim)}
.cal button.earn{background:rgba(217,178,60,.18);border-color:rgba(217,178,60,.36)}.cal button.earn .r{color:var(--goldsoft)}
.cal button.floor{background:rgba(95,180,137,.16);border-color:rgba(95,180,137,.34)}.cal button.floor .r{color:var(--jade)}
.cal button.dead{background:rgba(217,96,92,.15);border-color:rgba(217,96,92,.34)}.cal button.dead .r{color:var(--blood)}
.cal button.flask{background:rgba(97,165,232,.15);border-color:rgba(97,165,232,.36)}.cal button.flask .r{color:var(--flask)}
.cal button.today{outline:1.5px solid var(--gold);outline-offset:-1.5px}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px;padding:0 4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  z-index:30;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:rgba(24,28,36,.72);border-radius:30px 30px 0 0;border-top:.5px solid var(--edge-top);
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
  transform:translateY(102%);transition:transform .42s cubic-bezier(.22,1,.36,1)}
.scrim.on .sheet{transform:none}
.grip{width:38px;height:5px;background:rgba(255,255,255,.22);border-radius:3px;margin:0 auto 13px}

/* ---- info affordance ---- */
.i{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:.5px solid var(--edge);
  background:var(--glass2);color:var(--ash);font-family:var(--serif);font-size:12px;font-style:italic;
  line-height:20px;text-align:center;box-shadow:0 1px 0 var(--edge-top) inset}
.i:active{transform:scale(.86)}
h2 .i{margin-left:8px;vertical-align:-5px;width:19px;height:19px;line-height:18px;font-size:11px}
.hdr b,.bossrow .nm,.sheet h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
.hdr b{font-size:16px}
.sheet h3{margin:0 0 3px;font-size:19px;color:var(--goldsoft)}
.sheet .kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.desc{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:#DCE1E8}
.desc p{margin:0 0 9px}
.desc p:last-child{margin:0}
.desc em{color:var(--goldsoft);font-style:italic}
.rule{height:.5px;background:linear-gradient(90deg,transparent,var(--edge-top),transparent);margin:12px 0}

/* ---- misc ---- */
.i{transition:transform .24s cubic-bezier(.34,1.5,.44,1),background .2s;width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:.5px solid rgba(217,178,60,.5);
  background:rgba(217,178,60,.12);color:var(--goldsoft);font-family:var(--mono);font-size:11px;line-height:17px;
  text-align:center;font-style:italic;margin-left:7px}
.i:active{transform:scale(.86)}
.tiptitle{font-size:17px;font-weight:600;letter-spacing:-.01em}
.tipbody{color:var(--ash);font-size:14px;line-height:1.5;margin-top:10px}
.tipbody b{color:var(--bone);font-weight:600}
.tipbody .l{display:flex;gap:9px;padding:6px 0;border-top:.5px solid var(--edge);justify-content:space-between}
.tipbody .l:first-child{border-top:none}
.tipbody .l span:last-child{font-family:var(--mono);color:var(--gold);white-space:nowrap}
.fold>.hdr{margin-bottom:0;cursor:pointer}
.fold.open>.hdr{margin-bottom:7px}
.foldwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1),opacity .28s ease;opacity:0}
.fold.open .foldwrap{grid-template-rows:1fr;opacity:1}
.foldinner{overflow:hidden;min-height:0}
.chev{display:inline-block;color:var(--dim);font-family:var(--mono);font-size:12px;
  transition:transform .38s cubic-bezier(.34,1.4,.44,1),color .3s ease}
.fold.open .chev{transform:rotate(90deg);color:var(--gold)}
#tour{position:fixed;inset:0;z-index:50;display:none}
#tour.on{display:block}
#hole{position:absolute;border-radius:18px;border:1.5px solid var(--goldsoft);pointer-events:none;
  transition:top .42s cubic-bezier(.22,1,.36,1),left .42s cubic-bezier(.22,1,.36,1),width .42s cubic-bezier(.22,1,.36,1),height .42s cubic-bezier(.22,1,.36,1),border-radius .3s ease;
  box-shadow:0 0 0 9999px rgba(5,7,11,.82),0 0 22px rgba(217,178,60,.45);transition:.22s}
#tcard{position:absolute;left:12px;right:12px;z-index:2;
  transition:top .42s cubic-bezier(.22,1,.36,1),bottom .42s cubic-bezier(.22,1,.36,1);background:rgba(26,31,40,.94);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:.5px solid var(--edge);border-radius:20px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#tcard h4{margin:0;font-size:16px}
#tcard p{margin:7px 0 0;font-size:13.5px;color:var(--ash);line-height:1.45}
#trow{display:flex;align-items:center;gap:9px;margin-top:13px}
#trow .step{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
#trow button.step{text-transform:uppercase;padding:8px 0}
.tx{position:absolute;top:8px;right:11px;color:var(--dim);font-size:21px;line-height:1;padding:4px 6px}
#trow .btn{margin:0;width:auto;padding:9px 15px}
.help{position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;
  border:.5px solid var(--edge);background:rgba(255,255,255,.06);color:var(--dim);
  font-family:var(--mono);font-size:12px;line-height:20px;text-align:center}
.help{transition:transform .24s cubic-bezier(.34,1.5,.44,1),color .2s}
.help:active{transform:scale(.86)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;
  border-radius:9px;border:.5px solid var(--edge);background:var(--glass);color:var(--ash);white-space:nowrap}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:12px 0 2px}
.gi{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:.5px solid var(--edge)}
.gi span{flex:1}
.gi.on span{text-decoration:line-through;color:var(--dim)}
.x{color:var(--dim);font-family:var(--mono);padding:0 6px;font-size:17px}
.bossrow{display:flex;justify-content:space-between;padding:9px 0;border-top:.5px solid var(--edge);
  font-family:var(--mono);font-size:13px;color:var(--ash);transition:color .35s ease}
.bossrow .nm{font-family:var(--sans)}
.bossrow.cur{color:var(--goldsoft)}
.bossrow.won{color:var(--dim);text-decoration:line-through}

/* ---- accessibility / fallbacks ---- */
@media(prefers-reduced-transparency:reduce){
  .card,nav,.sheet,.btn,.cal button,input,select,textarea{-webkit-backdrop-filter:none;backdrop-filter:none}
  .card,.btn,.cal button{background:#171B23}
  nav{background:#12161D}.sheet{background:#171B23}
  body::before{opacity:.35}
}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .card,.btn,.cal button{background:#171B23}
  nav{background:#12161D}.sheet{background:#171B23}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app">
  <main>
    <section id="v-today" class="view on"></section>
    <section id="v-food" class="view"></section>
    <section id="v-work" class="view"></section>
    <section id="v-hist" class="view"></section>
    <section id="v-stats" class="view"></section>
  </main>
  <nav id="tabs"><span id="pill"></span>
    <button data-t="today" class="on"><span>◉</span>Today</button>
    <button data-t="food"><span>◧</span>Food</button>
    <button data-t="work"><span>▤</span>Workouts</button>
    <button data-t="hist"><span>▦</span>Remembrances</button>
    <button data-t="stats"><span>◈</span>Attributes</button>
  </nav>
</div>
<div id="tour"><div id="hole"></div><div id="tcard"></div></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ storage ============ */
const KEY='ngplus.v3';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return mem}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}
}
const DEF={
  days:{},            // 'YYYY-MM-DD': day
  weights:{},         // date: lbs
  grocery:[],         // {t,s,done}
  lifts:[],           // {date,session,weight,reps}
  level:1, spent:0,
  stats:{vigor:1,endurance:1,strength:1,discipline:1},
  bossesWon:[],
  batch:{},           // 'YYYY-MM-DD'(sunday): true
  orders:[],          // {p:place,o:order}
  tourDone:0
};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
let S=Object.assign(fresh(),load()||{});
S.orders=S.orders||[];
S.stats=Object.assign({vigor:1,endurance:1,strength:1,discipline:1},S.stats||{});

/* ============ dates ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TODAY=iso(new Date());
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=n=>n.toLocaleString('en-US');
const isSunday=s=>parse(s).getDay()===0;

/* ============ day model ============ */
function blank(){return{s2k:0,protein:0,dinner:0,s7k:0,s10k:0,lift:0,lunchMade:0,flask:0,boss:0,meals:{b:'',l:'',d:''}}}
function day(d){if(!S.days[d])S.days[d]=blank();const x=S.days[d];if(!x.meals)x.meals={b:'',l:'',d:''};return x}
function has(d){return !!S.days[d]}

const stepMin=()=>2000+500*(S.stats.vigor-1);
const weekSteps=()=>[49,55,60,65,70][Math.min(S.stats.endurance-1,4)]*1000;
const liftsWeek=()=>1+S.stats.strength;
const RULES=['Dinner plated in the kitchen','No seconds','Snacks portioned into bags on shopping day','Nothing eaten standing at the counter'];
const rules=()=>RULES.slice(0,S.stats.discipline);

function floorDone(x){return (x.s2k||x.s7k||x.s10k)&&x.protein&&x.dinner}
function floorCount(x){return (x.s2k||x.s7k||x.s10k?1:0)+(x.protein?1:0)+(x.dinner?1:0)}
function runes(x){
  if(!x)return 0;let r=0;
  if(floorDone(x))r+=100;
  if(x.s10k)r+=200;else if(x.s7k)r+=100;
  if(x.lift)r+=300;
  if(x.lunchMade)r+=100;
  if(x.dinner)r+=100;
  if(x.boss)r+=500;
  return r;
}
function routine(x){return runes(x)-(x&&x.boss?500:0)}

/* ============ ledger: pool, cache, streak ============ */
function ledger(){
  const keys=Object.keys(S.days).sort();
  if(!keys.length)return{pool:-S.spent,cache:0,cacheLost:0,streak:0,dead:false};
  let cur=keys[0],pool=0,cache=0,lost=0,prevZero=false;
  const end=TODAY;
  while(cur<=end){
    const x=S.days[cur],r=runes(x),z=(r===0&&!(x&&x.flask))&&cur<end;
    if(cache&&x&&floorDone(x)){pool+=cache;cache=0}
    pool+=r;
    if(z){
      if(prevZero){cache=0;lost++}
      else{cache=pool;pool=0}
      prevZero=true;
    }else if(cur<end){prevZero=false}
    cur=shift(cur,1);
  }
  // streak: consecutive days back from today (today counts only if scored)
  let st=0,c=TODAY;
  if(runes(S.days[TODAY])===0&&!(S.days[TODAY]&&S.days[TODAY].flask))c=shift(TODAY,-1);
  while(true){const x=S.days[c];if(!x)break;if(runes(x)>0||x.flask){st++;c=shift(c,-1)}else break}
  return{pool:Math.max(0,pool-S.spent),cache,cacheLost:lost,streak:st};
}
const cost=lv=>1500+500*(lv-2);
const nextCost=()=>cost(S.level+1);

/* ============ flasks ============ */
function flasksUsed(){
  const m=TODAY.slice(0,7);
  return Object.keys(S.days).filter(d=>d.slice(0,7)===m&&S.days[d].flask).length;
}

const LADDER=[{w:135,n:'First Plate'},{w:155,n:'The Wall of Habit'},{w:185,n:'Old Ground'},{w:205,n:'The Approach'},{w:225,n:'Two Plates'}];
function lastLift(){return S.lifts.length?S.lifts[S.lifts.length-1]:null}
function nextSession(){const l=lastLift();return l&&l.session==='A'?'B':'A'}
function currentBoss(){
  const l=lastLift();
  if(!l)return 115;
  const stall=stalled();
  return stall?Math.round(l.weight*.85/5)*5:l.weight+10;
}
function stalled(){
  const n=S.lifts.length;
  return n>=2&&S.lifts[n-1].weight===S.lifts[n-2].weight;
}
function bossName(w){const b=LADDER.find(b=>b.w===w);return b?b.n:null}

function avg7(offset){
  let sum=0,n=0;
  for(let i=offset;i<offset+7;i++){const d=shift(TODAY,-i);if(S.weights[d]!=null){sum+=S.weights[d];n++}}
  return n?{v:sum/n,n}:null;
}
function weekRunes(off){
  // week = Sunday..Saturday; off 0 = current week
  const d=parse(TODAY);const sun=shift(TODAY,-d.getDay()-7*off);
  let t=0;for(let i=0;i<7;i++){t+=runes(S.days[shift(sun,i)])}
  return t;
}

/* ============ dom morph: keeps element identity so transitions run ============ */
function morph(a,b){
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeName!==b.nodeName||a.id!==b.id){a.replaceWith(b);return}
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes]){
    if(a.getAttribute(at.name)===at.value)continue;
    if(at.name==='value'&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')){
      if(document.activeElement!==a)a.value=at.value;
      a.setAttribute('value',at.value);continue;
    }
    a.setAttribute(at.name,at.value);
  }
  const an=[...a.childNodes],bn=[...b.childNodes],n=Math.max(an.length,bn.length);
  for(let i=0;i<n;i++){
    if(an[i]===undefined)a.appendChild(bn[i]);
    else if(bn[i]===undefined)an[i].remove();
    else morph(an[i],bn[i]);
  }
}
function morphChildren(a,b){
  const an=[...a.childNodes],bn=[...b.childNodes],n=Math.max(an.length,bn.length);
  for(let i=0;i<n;i++){
    if(an[i]===undefined)a.appendChild(bn[i]);
    else if(bn[i]===undefined)an[i].remove();
    else morph(an[i],bn[i]);
  }
}
function setHTML(node,html){
  if(!node.childNodes.length){node.innerHTML=html;return}
  const tmp=document.createElement('div');tmp.innerHTML=html;
  morphChildren(node,tmp);
}
/* count the rune tally up instead of snapping */
let lastRunes=null,runeRAF=0;
function animateTally(){
  const node=document.querySelector('.rune-big');if(!node)return;
  const to=runes(S.days[TODAY])||0;
  cancelAnimationFrame(runeRAF);
  if(lastRunes===null||to===lastRunes){lastRunes=to;node.textContent=to?'+'+fmt(to):'0';return}
  const from=lastRunes,t0=performance.now(),dur=460;
  lastRunes=to;
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=Math.round(from+(to-from)*e);
    node.textContent=v?'+'+fmt(v):'0';
    if(k<1)runeRAF=requestAnimationFrame(step);
  };
  runeRAF=requestAnimationFrame(step);
}

    ${S.orders.length?S.orders.map((o,i)=>`<div class="gi"><span><b>${esc(o.p)}</b><br><span style="color:var(--ash);font-size:13px">${esc(o.o)}</span></span><button class="x" data-odel="${i}">&times;</button></div>`).join(''):'<div class="hint">Decide your order at each place once, while you are not hungry.</div>'}
    <div class="split" style="margin-top:8px"><input type="text" id="oplace" placeholder="Place"><input type="text" id="oorder" placeholder="The order"></div>
    <button class="btn sm" id="oadd" style="margin-top:8px">Save order</button>`)}

  ${fold('groc','Grocery list','',left?left+' left':'',`
    <div class="split"><input type="text" id="gtext" placeholder="Add item">
      <select id="gsect" style="flex:0 0 42%">${SECTIONS.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <button class="btn sm" id="gadd" style="margin-top:8px">Add</button>
    ${S.grocery.length?SECTIONS.filter(s=>bySect[s]).map(s=>`
      <div class="sect">${s}</div>
      ${bySect[s].map(([g,i])=>`<div class="gi ${g.done?'on':''}">
        <button class="box" data-gtog="${i}" aria-label="toggle"></button>
        <span>${esc(g.t)}</span><button class="x" data-gdel="${i}">&times;</button></div>`).join('')}
    `).join(''):'<div class="hint">Empty. Build it Sunday, shop once.</div>'}
    ${S.grocery.length?`<button class="btn sm" id="gclear" style="margin-top:9px">Clear checked</button>`:''}`)}
  `;
}

/* ---------- WORKOUTS ---------- */
function vWork(){
  const l=lastLift(),next=nextSession(),boss=currentBoss(),stall=stalled(),won=S.bossesWon;
  return `
  <h2>Next session ${I('lifting')}</h2>
  <div class="card" id="t-session">
    <div class="hdr"><b style="font-size:20px" class="num">Session ${next}</b>
      <span class="tag">${l?'Last: '+l.session+' &middot; '+l.weight+'&times;'+l.reps:'First session'}</span></div>
    <div class="kv"><span>Target</span><span class="n gold">${boss} &times; 3</span></div>
    <div class="kv"><span>This week</span><span class="n">${liftsThisWeek()} / ${liftsWeek()}</span></div>
    ${stall?`<div class="hint" style="color:var(--blood)">Stalled twice at ${l.weight}. Respawn at the stake: ${boss}, then climb back.</div>`:''}
    <div class="split" style="margin-top:9px">
      <div><div class="eyebrow">Weight</div><input type="number" id="lw" inputmode="numeric" value="${boss}"></div>
      <div><div class="eyebrow">Reps</div><input type="number" id="lr" inputmode="numeric" value="3"></div>
    </div>
    <div class="split" style="margin-top:8px">
      <button class="btn gold" data-log="A" style="margin:0">Log A</button>
      <button class="btn gold" data-log="B" style="margin:0">Log B</button>
    </div>
    ${l?`<button class="btn sm" id="undolift" style="width:100%;margin-top:8px">Undo last log</button>`:''}
  </div>
  ${fold('ladder','Boss ladder','',won.length+' cleared',
    LADDER.map(b=>`<div class="bossrow ${won.includes(b.w)?'won':(boss>=b.w-9&&boss<=b.w?'cur':'')}">
      <span class="nm">${b.n}</span><span>${b.w}</span></div>`).join('')
    +'<div class="hint">Restart at 115, +10 per session while it moves. 225 is a rematch.</div>')}`;
}
function liftsThisWeek(){
  const sun=shift(TODAY,-parse(TODAY).getDay());
  return S.lifts.filter(l=>l.date>=sun&&l.date<=TODAY).length;
}

/* ---------- HISTORY ---------- */
let calM=new Date().getMonth(),calY=new Date().getFullYear();
function vHist(){
  const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate();
  let cells='';
  for(let i=0;i<first.getDay();i++)cells+='<button class="pad" disabled></button>';
  for(let d=1;d<=days;d++){
    const k=calY+'-'+pad(calM+1)+'-'+pad(d),x=S.days[k],r=runes(x);
    let c='';
    if(x&&x.flask)c='flask';
    else if(r>200)c='earn';
    else if(r>0)c='floor';
    else if(x&&k<TODAY)c='dead';
    cells+=`<button data-day="${k}" class="${c} ${k===TODAY?'today':''}">
      <span class="d">${d}</span><span class="r">${r?r:(c==='flask'?'F':(c==='dead'?'0':''))}</span></button>`;
  }
  return `
  <div class="hdr">
    <button class="btn sm" data-cal="-1">&larr;</button>
    <b class="num">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b>
    <button class="btn sm" data-cal="1">&rarr;</button>
  </div>
  <div class="cal" id="t-cal">${'SMTWTFS'.split('').map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <div class="legend eyebrow">
    <span><i style="background:#54471A"></i>Runes</span>
    <span><i style="background:#2F5942"></i>Floor</span>
    <span><i style="background:#5C2626"></i>Death</span>
    <span><i style="background:#2C4C69"></i>Flask</span>
  </div>
  <div class="hint">Tap any day to backfill or correct it.</div>`;
}
function sheetDay(k){
  const x=day(k),r=runes(x),flasksLeft=2-flasksUsed();
  const R=(kk,l,s,v,on,dis)=>`<button class="row ${on?'on':''}" data-k="${kk}" data-d="${k}" ${dis?'disabled':''}>
    <span class="box"></span><span class="lbl">${l}${s?`<span class="sub">${s}</span>`:''}</span><span class="val">${v||''}</span></button>`;
  el('sheet').innerHTML=`<div class="grip"></div>
    <div class="hdr"><b>${parse(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</b>
      <span class="st gold num">${r?'+'+fmt(r):'0'} runes</span></div>
    <div class="card" style="margin:0 0 10px">
      ${R('s2k',fmt(stepMin())+' steps','Floor','',x.s2k||x.s7k||x.s10k,x.s7k||x.s10k)}
      ${R('protein','Protein at lunch','Floor','',x.protein)}
      ${R('dinner','Dinner plated in the kitchen','Floor','+100',x.dinner)}
      ${R('s7k','7,000 steps','','+100',x.s7k||x.s10k,!!x.s10k)}
      ${R('s10k','10,000 steps','','+200',x.s10k)}
      ${R('lift','Lift session','','+300',x.lift)}
      ${R('lunchMade','Lunch was already made','','+100',x.lunchMade)}
    </div>
    <div class="card" style="margin:0 0 10px">
      <div class="eyebrow">Breakfast</div>
      <input type="text" data-meal="b" data-d="${k}" value="${esc(x.meals.b)}" placeholder="Eggs and sausage" style="margin:3px 0 8px">
      <div class="eyebrow">Lunch</div>
      <input type="text" data-meal="l" data-d="${k}" value="${esc(x.meals.l)}" placeholder="What you ate" style="margin:3px 0 8px">
      <div class="eyebrow">Dinner</div>
      <input type="text" data-meal="d" data-d="${k}" value="${esc(x.meals.d)}" placeholder="What you ate" style="margin:3px 0 0">
    </div>
    ${r===0&&flasksLeft>0||x.flask?`<button class="btn" data-flask="${k}" style="border-color:#2C4C69;color:var(--flask)">
      ${x.flask?'Undo flask':'Spend flask &middot; '+flasksLeft+' left'}</button>`:''}
    <button class="btn" data-clearday="${k}">Clear this day</button>
    <button class="btn" id="closeSheet">Done</button>`;
  el('scrim').classList.add('on');
}

/* ---------- STATS ---------- */
function vStats(){
  const L=ledger(),a=avg7(0),b=avg7(7),d=(a&&b)?b.v-a.v:null;
  const wk=weekRunes(0),lw=weekRunes(1);
  const afford=L.pool>=nextCost();
  const st=S.stats,capd=(k)=>(k==='strength'||k==='endurance')&&st[k]>=st.vigor+1;
  const btn=(k,lbl)=>`<button class="btn sm" data-lvl="${k}" ${(!afford||capd(k))?'disabled':''}>${lbl}</button>`;
  return `
  <h2>Weight ${I('weight')}</h2>
  <div class="card" id="t-weight">
    ${(isSunday(TODAY)||SHOWW)?`
    <div class="kv"><span>7-day avg vs prior</span><span class="n">${a?a.v.toFixed(1):'&mdash;'} <span style="color:var(--dim)">/ ${b?b.v.toFixed(1):'&mdash;'}</span></span></div>
    <div class="kv"><span>Change</span><span class="n ${d==null?'':(d>=0.5?'ok':(d<0?'bad':''))}">${d==null?'&mdash;':(d>0?'-':'+')+Math.abs(d).toFixed(1)+' lb'}</span></div>
    <div class="hint">Target 0.5 to 1.0 lb down per week. Single days mean nothing.</div>`:`
    <div class="kv"><span>${Object.keys(S.weights).length} weigh-in${Object.keys(S.weights).length===1?'':'s'} logged</span><button class="btn sm" id="showw">Show</button></div>
    <div class="hint">Numbers open on their own at the Site of Grace. Logging is the job.</div>`}
  </div>

  <h2>Runes ${I('progress')}</h2>
  <div class="card">
    <div class="kv"><span>This week vs last</span><span class="n gold">${fmt(wk)} <span style="color:var(--dim)">/ ${fmt(lw)}</span></span></div>
    <div class="kv"><span>Banked</span><span class="n">${fmt(L.pool)} / ${fmt(nextCost())} to Level ${S.level+1}</span></div>
    ${L.cacheLost?`<div class="kv"><span>Runes lost for good</span><span class="n bad">${L.cacheLost}</span></div>`:''}
    <div class="hint">${wk>lw?'Beating last week is the only weekly target.':'Behind last week. Just farm.'}</div>
  </div>

  ${fold('level','Level '+S.level,'progress',afford?'level up':'',`
    <div class="kv"><span>Vigor ${st.vigor}<span class="sub" style="color:var(--dim)"> &middot; ${fmt(stepMin())} steps</span></span>${btn('vigor','+1')}</div>
    <div class="kv"><span>Endurance ${st.endurance}<span class="sub" style="color:var(--dim)"> &middot; ${fmt(weekSteps())}/wk</span></span>${btn('endurance','+1')}</div>
    <div class="kv"><span>Strength ${st.strength}<span class="sub" style="color:var(--dim)"> &middot; ${liftsWeek()} lifts/wk</span></span>${btn('strength','+1')}</div>
    <div class="kv"><span>Mind ${st.discipline}<span class="sub" style="color:var(--dim)"> &middot; ${rules().length} rule${rules().length>1?'s':''}</span></span>${btn('discipline','+1')}</div>
    <div class="hint">${afford?'Spending '+fmt(nextCost())+' banks the runes permanently and raises the requirement.':'Need '+fmt(Math.max(0,nextCost()-L.pool))+' more runes.'}</div>`)}

  ${fold('data','Rebirth','',''.trim(),`
    <div class="split"><button class="btn sm" id="exp" style="flex:1;margin:0">Export JSON</button>
      <button class="btn sm" id="imp" style="flex:1;margin:0">Import JSON</button></div>
    <button class="btn sm" id="resetday" style="width:100%;margin-top:8px">Reset today</button>
    <button class="btn sm" id="resetall" style="width:100%;margin-top:8px;border-color:rgba(217,96,92,.45);color:var(--blood)">Erase everything</button>
    <div class="hint">Any tapped row can be untapped. These are for clearing a whole day or starting over.</div>`)}
  <div style="height:14px"></div>`;
}

/* ============ events ============ */
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

document.addEventListener('click',e=>{
  const t=e.target.closest('#tour,#tnext,#tback,#tskip,#tskip2,#tourgo,#tourgo2,[data-fold],[data-tip],[data-t],[data-k],[data-flask],[data-day],[data-cal],[data-log],[data-lvl],[data-gtog],[data-gdel],[data-odel],[data-batch],[data-go],#wclear,#undolift,#resetday,#resetall,[data-clearday],#showw,#gadd,#gclear,#oadd,#wtsave,#wsave,#wasave,#exp,#imp,#closeSheet,#scrim');
  if(!t)return;

  if(t.id==='tnext'){TI++;drawTour();return}
  if(t.id==='tback'){TI--;drawTour();return}
  if(t.id==='tskip'||t.id==='tskip2'||t.id==='tour'){tourEnd();return}
  if(t.id==='tourgo'){showAbout();return}
  if(t.id==='tourgo2'){el('scrim').classList.remove('on');setTimeout(tourStart,260);return}
  if(t.dataset.fold){OPEN[t.dataset.fold]=OPEN[t.dataset.fold]?0:1;render();return}
  if(t.dataset.tip){showTip(t.dataset.tip);return}
  if(t.dataset.t||t.dataset.go){go(t.dataset.t||t.dataset.go);return}

  if(t.dataset.k){
    const x=day(t.dataset.d),k=t.dataset.k;
    x[k]=x[k]?0:1;
    if(k==='s10k'&&x.s10k)x.s7k=0;
    if((k==='s7k'||k==='s10k')&&(x.s7k||x.s10k))x.s2k=1;
    afterEdit(t.dataset.d);return;
  }
  if(t.dataset.flask){
    const k=t.dataset.flask,x=day(k);
    if(!x.flask&&flasksUsed()>=2)return;
    x.flask=x.flask?0:1;afterEdit(k);return;
  }
  if(t.dataset.day){sheetDay(t.dataset.day);return}
  if(t.dataset.cal){calM+=+t.dataset.cal;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}
  if(t.id==='closeSheet'||(t.id==='scrim'&&e.target.id==='scrim')){el('scrim').classList.remove('on');return}
  if(t.id==='scrim')return;

  if(t.dataset.log){
    const w=+el('lw').value,r=+el('lr').value;
    if(!w||!r)return;
    S.lifts.push({date:TODAY,session:t.dataset.log,weight:w,reps:r});
    day(TODAY).lift=1;
    const b=LADDER.find(b=>b.w===w);
    if(b&&!S.bossesWon.includes(w)&&r>=1){S.bossesWon.push(w);day(TODAY).boss=1}
    render();return;
  }
  if(t.dataset.lvl){
    const k=t.dataset.lvl;
    S.spent+=nextCost();S.level++;S.stats[k]++;render();return;
  }
  if(t.dataset.gtog!=null){S.grocery[+t.dataset.gtog].done=!S.grocery[+t.dataset.gtog].done;render();return}
  if(t.dataset.gdel!=null){S.grocery.splice(+t.dataset.gdel,1);render();return}
  if(t.dataset.batch){const k=t.dataset.batch;S.batch[k]=!S.batch[k];render();return}
  if(t.id==='gadd'){
    const v=el('gtext').value.trim();if(!v)return;
    S.grocery.push({t:v,s:el('gsect').value,done:false});render();
    const i=el('gtext');if(i){i.focus()}return;
  }
  if(t.dataset.odel!=null){S.orders.splice(+t.dataset.odel,1);render();return}
  if(t.id==='oadd'){
    const pl=el('oplace').value.trim(),or=el('oorder').value.trim();
    if(!pl||!or)return;S.orders.push({p:pl,o:or});render();return;
  }
  if(t.id==='gclear'){S.grocery=S.grocery.filter(g=>!g.done);render();return}
  if(t.id==='showw'){SHOWW=true;render();return}
  if(t.id==='wclear'){delete S.weights[TODAY];render();return}
  if(t.id==='undolift'){
    const last=S.lifts.pop();
    if(last){
      if(!S.lifts.some(x=>x.date===last.date)){const dd=S.days[last.date];if(dd){dd.lift=0;dd.boss=0}}
      const i=S.bossesWon.indexOf(last.weight);if(i>-1)S.bossesWon.splice(i,1);
    }
    render();return;
  }
  if(t.dataset.clearday){
    const k=t.dataset.clearday;
    S.days[k]=blank(); S.lifts=S.lifts.filter(x=>x.date!==k);
    render(); sheetDay(k); return;
  }
  if(t.id==='resetday'){S.days[TODAY]=blank();S.lifts=S.lifts.filter(x=>x.date!==TODAY);delete S.weights[TODAY];render();return}
  if(t.id==='resetall'){
    if(confirm('Erase all logged days, lifts, weights, levels and lists? This cannot be undone.')){
      S=fresh();S.tourDone=1;lastRunes=null;day(TODAY);render();
    }
    return;
  }
  if(t.id==='wtsave'){const v=parseFloat(el('wtoday').value);if(!isNaN(v)&&v>0){S.weights[TODAY]=v;render()}return}
  if(t.id==='wsave'){const v=parseFloat(el('wt').value);if(!isNaN(v)){S.weights[TODAY]=v;render()}return}
  if(t.id==='exp'){
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ng-plus-'+TODAY+'.json';a.click();return;
  }
  if(t.id==='imp'){
    const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{try{S=Object.assign(fresh(),JSON.parse(rd.result));lastRunes=null;render()}catch(e){alert('Bad file.')}};rd.readAsText(f)};
    i.click();return;
  }
});
document.addEventListener('input',e=>{
  const m=e.target.dataset.meal;
  if(m){const dd=e.target.dataset.d||TODAY;day(dd).meals[m]=e.target.value;save()}
});
function afterEdit(d){
  const openSheet=el('scrim').classList.contains('on');
  render();
  if(openSheet)sheetDay(d);
}
/* ============ sheet: swipe down to dismiss ============ */
(function(){
  const sheetEl=el('sheet'),scrimEl=el('scrim');
  let startY=0,curY=0,dragging=false,startedAtTop=false;
  sheetEl.addEventListener('touchstart',e=>{
    if(!scrimEl.classList.contains('on'))return;
    startY=curY=e.touches[0].clientY;
    startedAtTop=sheetEl.scrollTop<=0;
    dragging=false;
    sheetEl.style.transition='none';
  },{passive:true});
  sheetEl.addEventListener('touchmove',e=>{
    if(!scrimEl.classList.contains('on'))return;
    curY=e.touches[0].clientY;
    const dy=curY-startY;
    if(!dragging){
      if(startedAtTop&&dy>6)dragging=true;
      else return;
    }
    if(dy>0){
      e.preventDefault();
      sheetEl.style.transform='translateY('+dy+'px)';
      scrimEl.style.opacity=String(Math.max(.35,1-dy/420));
    }
  },{passive:false});
  function release(){
    if(!dragging)return;
    const dy=Math.max(0,curY-startY);
    dragging=false;
    if(dy>90){
      sheetEl.style.transition='transform .3s cubic-bezier(.32,0,.67,0)';
      sheetEl.style.transform='translateY(100%)';
      scrimEl.style.transition='opacity .3s ease';
      scrimEl.style.opacity='0';
      setTimeout(()=>{
        scrimEl.classList.remove('on');
        sheetEl.style.transition='';sheetEl.style.transform='';
        scrimEl.style.transition='';scrimEl.style.opacity='';
      },300);
    }else{
      sheetEl.style.transition='transform .32s cubic-bezier(.34,1.5,.44,1)';
      sheetEl.style.transform='';
      scrimEl.style.transition='opacity .25s ease';
      scrimEl.style.opacity='';
      setTimeout(()=>{sheetEl.style.transition='';scrimEl.style.transition=''},320);
    }
  }
  sheetEl.addEventListener('touchend',release);
  sheetEl.addEventListener('touchcancel',release);
})();

const TABS=['today','food','work','hist','stats'];
function go(t){
  const dir=TABS.indexOf(t)>TABS.indexOf(tab)?1:-1, changed=t!==tab;
  tab=t;
  const pill=el('pill');if(pill)pill.style.transform='translateX('+(TABS.indexOf(t)*100)+'%)';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>{
    const on=v.id==='v-'+t;
    v.classList.toggle('on',on);
    if(on&&changed){v.style.setProperty('--dir',dir);v.classList.remove('slide');void v.offsetWidth;v.classList.add('slide')}
  });
  document.querySelector('main').scrollTop=0;
}
day(TODAY);
render();
addEventListener('visibilitychange',()=>{
  if(!document.hidden&&iso(new Date())!==TODAY)location.reload();
});
addEventListener('focus',()=>{if(iso(new Date())!==TODAY)location.reload()});



if(!S.tourDone){S.tourDone=1;save();setTimeout(tourStart,450)}
</script>
