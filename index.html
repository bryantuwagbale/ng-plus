<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>climb</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#0B0E14;
  --bone:#E9EFF6; --ash:#94A5B8; --dim:#65748A;
  --panel:#151B26; --panel2:#1C2432;
  --edge:rgba(150,182,214,.16);
  --r:20px; --r-in:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --jade:#59A98A; --blood:#C25C57; --flask:#5FA5DA; --gold:#D6B15C;
  /* rank accents */
  --iron:#8C97A6; --bronze:#C57B4B; --silver:#B9C4D0; --gold-t:#E8B44A; --plat:#4FD1C5;
  --emerald:#3FBF7F; --diamond:#5B9EF0; --master:#B76BE8; --gm:#E85B5B; --chal:#57E0E0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{margin:0;color:var(--bone);font-family:var(--sans);font-size:15px;line-height:1.35;
  background:var(--bg);overscroll-behavior:none;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

#app{position:fixed;top:0;right:0;bottom:0;left:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 15px 6px}
header .title{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.02em;display:flex}
header .title .lg{
  background:linear-gradient(160deg,#dff0ff 0%,#ffffff 22%,#9fcdf5 42%,#ffffff 62%,#6fa8dc 82%,#eaf5ff 100%);
  background-size:220% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 5px rgba(150,205,255,.4);position:relative;animation:shimmer 10s ease-in-out infinite}
header .title .lg:nth-child(2){animation-delay:-2s}
header .title .lg:nth-child(3){animation-delay:-4s}
header .title .lg:nth-child(4){animation-delay:-6s}
header .title .lg:nth-child(5){animation-delay:-8s}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#tourBtn{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:.5px solid var(--edge);
  font-family:var(--mono);font-size:13px;color:var(--ash);display:flex;align-items:center;justify-content:center;flex:0 0 28px}
#tourBtn:active{transform:scale(.9)}
main{flex:1;overflow-y:auto;padding:4px 13px calc(90px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h2{margin:10px 4px 4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);color:var(--ash);font-weight:500}
h2:first-child{margin-top:2px}

.card{background:var(--panel);border:.5px solid var(--edge);border-radius:var(--r);
  padding:11px 13px;margin-bottom:6px;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.35);
  transition:box-shadow .3s ease,border-color .3s ease}
.card.tour-hl{border-color:rgba(91,158,240,.55);box-shadow:0 0 0 3px rgba(91,158,240,.22),0 8px 26px rgba(91,158,240,.3);
  animation:tourPulse 1.6s ease-in-out infinite}
@keyframes tourPulse{0%,100%{box-shadow:0 0 0 3px rgba(91,158,240,.22),0 8px 26px rgba(91,158,240,.3)}
  50%{box-shadow:0 0 0 6px rgba(91,158,240,.08),0 8px 26px rgba(91,158,240,.2)}}

/* rank readout */
.rankhdr{display:flex;align-items:center;gap:11px}
.rankbadge{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:15px;font-weight:700;color:#0A0C10}
.rankname{font-family:var(--serif);font-size:19px;font-weight:600}
.rankdiv{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1px}
.lpbar{margin-top:9px}
.lpbar .track{height:7px;border-radius:4px;background:rgba(150,182,214,.14);overflow:hidden}
.lpbar .fill{height:100%;border-radius:4px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.lpbar .num{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between}
.meta{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:.5px solid var(--edge)}
.meta div{flex:1;min-width:0}
.meta .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.meta .v{font-family:var(--mono);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--jade)}.bad{color:var(--blood)}.blue{color:var(--flask)}.goldc{color:var(--gold)}
.mono{font-family:var(--mono)}

.pending{margin-top:10px;padding-top:9px;border-top:.5px solid var(--edge);font-family:var(--mono);font-size:12.5px;color:var(--ash)}
.pending b{color:var(--bone)}

.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hdr .st{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ash)}

.row{display:flex;align-items:center;gap:11px;padding:7px 2px;border-top:.5px solid var(--edge);width:100%;text-align:left}
.row:first-of-type{border-top:none}
.box{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--edge);border-radius:8px;position:relative;background:var(--panel2);
  transition:background .2s ease,border-color .2s ease}
.row.on .box{background:var(--jade);border-color:rgba(238,231,216,.5)}
.box::after{content:"";position:absolute;left:7px;top:3.5px;width:4px;height:10px;border:solid #08120D;border-width:0 2.2px 2.2px 0;
  opacity:0;transform:rotate(42deg) scale(.4);transition:opacity .14s ease,transform .22s ease}
.row.on .box::after{opacity:1;transform:rotate(42deg) scale(1)}
.row .lbl{flex:1;min-width:0}
.row .sub{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.row .val{font-family:var(--mono);font-size:12px;color:var(--dim)}
.row.on .val{color:var(--gold)}
.row:disabled{opacity:.4}

.btn{display:block;width:100%;padding:11px;border:.5px solid var(--edge);border-radius:var(--r-in);background:var(--panel2);
  font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-top:9px}
.btn:active{transform:scale(.97)}
.btn.gold{border-color:rgba(217,178,60,.4);color:#F0D489;background:rgba(217,178,60,.14)}
.btn.sm{width:auto;padding:8px 13px;margin:0;font-size:11px;border-radius:12px}
.btn:disabled{opacity:.3}
.split{display:flex;gap:9px}.split>*{flex:1}
input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--panel2);border:.5px solid var(--edge);border-radius:12px;padding:9px 11px;font-size:16px}
input::placeholder{color:var(--dim)}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.4}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--edge);font-size:14px}
.kv:first-child{border-top:none}
.kv .n{font-family:var(--mono);white-space:nowrap}

nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:496px;margin:0 auto;
  display:flex;background:#101927;border:.5px solid var(--edge);border-radius:26px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:10}
nav button{flex:1;padding:7px 1px 6px;border-radius:21px;font-family:var(--mono);font-size:8px;letter-spacing:.01em;text-transform:uppercase;
  color:var(--dim);position:relative;z-index:1}
nav button span{display:block;font-size:15px;line-height:1;margin-bottom:3px;opacity:.5}
nav button.on{color:#0A0C10}
nav button.on span{opacity:1}
#pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:21px;
  background:linear-gradient(180deg,#F0CE63,#C99B22);box-shadow:0 3px 12px rgba(214,177,92,.35);
  transition:transform .38s cubic-bezier(.32,1.28,.38,1)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-family:var(--mono);font-size:9px;color:var(--dim);padding-bottom:3px}
.cal button{aspect-ratio:1;border:.5px solid var(--edge);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--panel2);font-family:var(--mono);gap:1px}
.cal button.pad{border:none;background:none}
.cal button .d{font-size:11px;color:var(--ash)}
.cal button .r{font-size:9px;color:var(--dim)}
.cal button.s{background:rgba(217,178,60,.18);border-color:rgba(217,178,60,.36)}.cal button.s .r{color:#F0D489}
.cal button.w{background:rgba(95,180,137,.16);border-color:rgba(95,180,137,.34)}.cal button.w .r{color:var(--jade)}
.cal button.l{background:rgba(217,96,92,.15);border-color:rgba(217,96,92,.34)}.cal button.l .r{color:var(--blood)}
.cal button.fl{background:rgba(97,165,232,.15);border-color:rgba(97,165,232,.36)}.cal button.fl .r{color:var(--flask)}
.cal button.today{outline:1.5px solid #F0D489;outline-offset:-1.5px}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px;padding:0 4px;font-size:11px;color:var(--ash)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

.scrim{position:fixed;inset:0;background:rgba(4,3,1,.66);z-index:30;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--panel);border-radius:26px 26px 0 0;
  border-top:.5px solid var(--edge);padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;
  box-shadow:0 -12px 34px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .34s cubic-bezier(.22,1,.36,1)}
.scrim.on .sheet{transform:none}
.grip{width:36px;height:5px;background:var(--edge);border-radius:3px;margin:0 auto 13px}
.sheet h3{margin:0 0 3px;font-size:19px;color:#F0D489;font-family:var(--serif)}
.tiptitle{font-size:17px;font-weight:600}
.tipbody{color:var(--ash);font-size:14px;line-height:1.5;margin-top:10px}
.tipbody b{color:var(--bone)}
.tipbody .l{display:flex;gap:9px;padding:6px 0;border-top:.5px solid var(--edge);justify-content:space-between}
.tipbody .l:first-child{border-top:none}
.tipbody .l span:last-child{font-family:var(--mono);color:var(--gold);white-space:nowrap}
.i{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:.5px solid rgba(214,177,92,.34);background:rgba(214,177,92,.14);
  color:#F0D489;font-family:var(--mono);font-size:11px;line-height:18px;text-align:center;font-style:italic;margin-left:7px}

.gi{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:.5px solid var(--edge)}
.gi span{flex:1}
.gi.on span{text-decoration:line-through;color:var(--dim)}
.x{color:var(--dim);font-family:var(--mono);padding:0 6px;font-size:17px}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:12px 0 2px}
.bossrow{display:flex;justify-content:space-between;padding:9px 0;border-top:.5px solid var(--edge);font-family:var(--mono);font-size:13px;color:var(--ash)}
.bossrow.cur{color:#F0D489}
.bossrow.won{color:var(--dim);text-decoration:line-through}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><span class="title"><span class="lg">c</span><span class="lg">l</span><span class="lg">i</span><span class="lg">m</span><span class="lg">b</span></span><button id="tourBtn" aria-label="Help">?</button></header>
  <main id="mainScroll">
    <section id="v-today" class="view on"></section>
    <section id="v-food" class="view"></section>
    <section id="v-work" class="view"></section>
    <section id="v-hist" class="view"></section>
    <section id="v-stats" class="view"></section>
  </main>
  <nav id="tabs"><span id="pill"></span>
    <button data-t="today" class="on"><span>◉</span>Today</button>
    <button data-t="food"><span>◧</span>Food</button>
    <button data-t="work"><span>▤</span>Lift</button>
    <button data-t="hist"><span>▦</span>Matches</button>
    <button data-t="stats"><span>◈</span>Rank</button>
  </nav>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ storage ============ */
const KEY='climb.v1';
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const DEF={
  startDate:null,
  days:{},        // 'YYYY-MM-DD': {steps,lunch,dinner,lift,flask}
  weights:{},
  waist:{},       // monthly, keyed by date
  lifts:[],       // {date,session,weight,reps}
  bossesWon:[],
  bossAttempts:{},// weight: count
  grocery:[],
  batch:{},       // 'YYYY-MM-DD' sunday: {l:bool,d:bool}
  orders:[],
  sessions:[],    // {date,session,seconds}
  exerciseLast:{} // key: last weight used
};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
let S=Object.assign(fresh(),load()||{});
S.orders=S.orders||[];S.grocery=S.grocery||[];S.bossAttempts=S.bossAttempts||{};

/* ============ dates ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TODAY=iso(new Date());
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
if(!S.startDate)S.startDate=TODAY;

/* ============ day model ============ */
function blank(){return{steps:0,lunch:0,dinner:0,lift:0,flask:0,workoutSec:0,meals:{l:'',d:''}}}
function day(d){if(!S.days[d])S.days[d]=blank();const x=S.days[d];if(!x.meals)x.meals={l:'',d:''};return x}

function floorOK(x){return x.steps>=2000&&x.lunch&&x.dinner}
function sRankOK(x){return floorOK(x)&&x.lift&&x.steps>=7000}
function dayType(x){
  if(!x)return 'l';
  if(x.flask)return 'fl';
  if(sRankOK(x))return 's';
  if(floorOK(x))return 'w';
  return 'l';
}
function dayLP(x,t){t=t||dayType(x);return t==='s'?30:t==='w'?15:t==='fl'?0:-20}
const DAYLABEL={s:'S-Tier',w:'Autopilot',l:'Loss',fl:'Loss mitigated'};

/* ============ ledger: replays every settled day (before today) ============ */
const START_LP=800; // Silver IV — somewhere to fall to
function ledger(){
  let d=S.startDate,totalLP=START_LP,streak=0,flasksMonth={};
  while(d<TODAY){
    const x=S.days[d]||blank();
    const t=dayType(x);
    if(t==='fl'){
      const m=d.slice(0,7);flasksMonth[m]=(flasksMonth[m]||0)+1;
    }else if(t==='s'||t==='w'){
      streak++;
    }else{
      streak=0;
    }
    totalLP=Math.max(0,totalLP+dayLP(x,t));
    d=shift(d,1);
  }
  return{totalLP,streak,flasksMonth};
}
function flasksUsedThisMonth(){
  const m=TODAY.slice(0,7);
  let n=(ledger().flasksMonth[m]||0);
  if(day(TODAY).flask)n++;
  return n;
}

/* ============ rank math ============ */
const TIERS=['Iron','Bronze','Silver','Gold','Platinum','Emerald','Diamond'];
const TIERCOL=['iron','bronze','silver','gold-t','plat','emerald','diamond'];
const DIVS=['IV','III','II','I'];
function rankFromLP(totalLP){
  const divIdx=Math.floor(totalLP/100);
  if(divIdx<28){
    const tierIdx=Math.floor(divIdx/4),div=DIVS[divIdx%4],lp=totalLP%100;
    return{name:TIERS[tierIdx],div,lp,col:TIERCOL[tierIdx],capped:false,next:100};
  }
  const over=totalLP-2800;
  if(over<200)return{name:'Master',div:'',lp:over,col:'master',capped:true,next:200};
  if(over<400)return{name:'Grandmaster',div:'',lp:over-200,col:'gm',capped:true,next:200};
  return{name:'Challenger',div:'',lp:over-400,col:'chal',capped:true,next:null};
}
const COLVAR={iron:'--iron',bronze:'--bronze',silver:'--silver','gold-t':'--gold-t',plat:'--plat',emerald:'--emerald',diamond:'--diamond',master:'--master',gm:'--gm',chal:'--chal'};

/* ============ squat ladder ============ */
const SESSION_LABEL={A:'Friday',B:'Saturday'};
function lastLift(){return S.lifts.length?S.lifts[S.lifts.length-1]:null}
function nextSession(){const l=lastLift();return l&&l.session==='A'?'B':'A'}
function stalled(){const n=S.lifts.length;return n>=2&&S.lifts[n-1].weight===S.lifts[n-2].weight&&S.lifts[n-1].weight===currentTargetRaw()}
function currentTargetRaw(){const l=lastLift();return l?l.weight+10:115}
function currentTarget(){
  const l=lastLift();
  if(!l)return 115;
  if(stalled())return Math.round(l.weight*.85/5)*5;
  return l.weight+10;
}

/* ============ weight ============ */
function avg7(offset){
  let sum=0,n=0;
  for(let i=offset;i<offset+7;i++){const d=shift(TODAY,-i);if(S.weights[d]!=null){sum+=S.weights[d];n++}}
  return n?{v:sum/n,n}:null;
}
/* weight-to-rank: 220=Silver IV start, 202=Diamond I, 185=Challenger */
const WANCHORS=[{w:220,lp:800},{w:202,lp:2700},{w:185,lp:3200}];
function slopeBetween(a,b){return(b.lp-a.lp)/(a.w-b.w)}
function weightToLP(w){
  if(w>=WANCHORS[0].w){
    const seg=slopeBetween(WANCHORS[0],WANCHORS[1]);
    return Math.max(0,WANCHORS[0].lp-(w-WANCHORS[0].w)*seg);
  }
  if(w>=WANCHORS[1].w){
    const seg=slopeBetween(WANCHORS[0],WANCHORS[1]);
    return WANCHORS[0].lp+(WANCHORS[0].w-w)*seg;
  }
  if(w>=WANCHORS[2].w){
    const seg=slopeBetween(WANCHORS[1],WANCHORS[2]);
    return WANCHORS[1].lp+(WANCHORS[1].w-w)*seg;
  }
  const seg=slopeBetween(WANCHORS[1],WANCHORS[2]);
  return WANCHORS[2].lp+(WANCHORS[2].w-w)*seg;
}

/* ============ tooltips ============ */
const TIP={
 rank:()=>['The rank','Every day resolves into one match result.<div class="l"><span>S-Tier</span><span>+30 LP</span></div><div class="l"><span>Autopilot (Floor)</span><span>+15 LP</span></div><div class="l"><span>Loss</span><span>-20 LP</span></div><br>100 LP promotes a division. You started at Silver IV, so there\'s room to fall to Bronze and Iron if the losses stack up. Iron IV 0 LP is the true floor.<br><br>Doing nothing counts as a Loss. Silence is the worst outcome on the board.'],
 floor:()=>['The Floor','<b>2,000 steps. Protein at lunch. Home-cooked dinner.</b><br><br>All three is Autopilot, worth +15 LP, the coasting-through-the-minimum day. Add a lift session and 7,000+ steps and it upgrades to S-Tier, +30 LP, the peak-performance day.<br><br>When you\'re behind, tired or tilted: Behind. Just farm.'],
 flask:()=>['Loss Mitigated','Two per calendar month, refill on the 1st. You have '+(2-flasksUsedThisMonth())+' left.<br><br>Marking a Loss day as mitigated makes it a no-match: 0 LP change, no demotion, streak intact. For a genuine bad day, not a planned one. Don\'t spend the second before the 15th.'],
 lifting:()=>['Lifting','Friday / Saturday sessions alternate. Log the top set only, weight and reps.<br><br>Squat ladder starts at 115, +10 lb per session while it keeps moving. Two stalls at the same weight means drop to 85% and climb back. Stalling doesn\'t cost LP.<br><br>225 is a rematch with the old peak, not a first meeting.'],
 kitchen:()=>['Food rules','<b>Ate home-cooked lunch / dinner</b> scores the decision to use food already at home, not the food\'s quality. Leftovers count, restaurant leftovers count.<br><br><b>Sunday batch:</b> 5 lunches, 5 dinners, one Instant Pot run, 2-3 sauce rotations so it isn\'t the same thing every day.<br><br><b>Ordering</b> isn\'t banned and has no separate system. It costs a Loss, or gets mitigated on a real bad day.'],
 weight:()=>['Weight','The 7-day average is the only number that means anything. A single day is water.<br><br><b>Weight rank</b> is a separate reference scale: 220 lb = Silver IV, 202 lb = Diamond I (old peak), 185 lb = Challenger. It doesn\'t affect your LP rank, it\'s just where the scale says you\'d place.<br><br>Target: 0.5-1.0 lb down per week. Judge the first three weeks on LP only, the scale is too noisy that early.']
};
function showTip(k){

}

function rankCard(){
  const{totalLP,streak}=ledger();
  const r=rankFromLP(totalLP);
  const pct=r.next?Math.min(100,Math.round(r.lp/r.next*100)):100;
  const label=r.div?r.name+' '+r.div:r.name;
  return`<div class="card" id="t-rank">
    <div class="hdr"><span class="st">Rank</span>${I('rank')}</div>
    <div class="rankhdr">
      <div class="rankbadge" style="background:var(${COLVAR[r.col]})">${r.name[0]}</div>
      <div><div class="rankname">${label}</div><div class="rankdiv">${r.lp} / ${r.next||'∞'} LP</div></div>
    </div>
    <div class="lpbar"><div class="track"><div class="fill" style="width:${pct}%;background:var(${COLVAR[r.col]})"></div></div></div>
    <div class="meta">
      <div><div class="k">Streak</div><div class="v goldc">${streak}${streak?'W':''}</div></div>
      <div><div class="k">Mitigated</div><div class="v blue">${2-flasksUsedThisMonth()} left</div></div>
      <div><div class="k">Squat next</div><div class="v">${currentTarget()}</div></div>
    </div>
    ${pendingLine()}
  </div>`;
}
function pendingLine(){
  const x=day(TODAY),t=dayType(x),lp=dayLP(x,t);
  const cls=t==='s'||t==='w'?'ok':t==='fl'?'blue':'bad';
  return `<div class="pending">Today, live: <b class="${cls}">${lp>=0?'+':''}${lp} LP</b> — ${DAYLABEL[t]}. Banks tonight.</div>`;
}

/* ============ active session (Friday/Saturday) ============ */
const REST_MS=90000, SESSION_MS=30*60000;
const EXDEFS={
  A:[{key:'squat',name:'Squat',weighted:true,def:()=>currentTarget()},
     {key:'bench',name:'Bench',weighted:true,def:()=>95},
     {key:'pulldown',name:'Lat Pulldown',weighted:true,def:()=>90}],
  B:[{key:'squat',name:'Squat',weighted:true,def:()=>currentTarget()},
     {key:'ohp',name:'DB Overhead Press',weighted:true,def:()=>30},
     {key:'pullup',name:'Pull-up',weighted:false,def:()=>0}]
};
let SESSION=null, SESSION_TIMER=null;
function exDefault(ex){return S.exerciseLast[ex.key]!=null?S.exerciseLast[ex.key]:ex.def()}
function startSession(){
  const ns=nextSession(),q=EXDEFS[ns];
  SESSION={session:ns,startTs:Date.now(),idx:0,restUntil:null,logged:[],
    draft:{weight:exDefault(q[0]),reps:0}};
  clearInterval(SESSION_TIMER);
  SESSION_TIMER=setInterval(()=>{ if(!SESSION){clearInterval(SESSION_TIMER);return} tickSession() },1000);
  render();
}
function endSession(){clearInterval(SESSION_TIMER);SESSION=null;render()}
function tickSession(){
  if(!SESSION||tab!=='work')return;
  const clockEl=el('clockDisplay');
  if(clockEl){
    const rem=Math.max(0,SESSION_MS-(Date.now()-SESSION.startTs));
    clockEl.textContent=fmtClock(rem);
    clockEl.classList.toggle('bad',rem<300000);
  }
  if(SESSION.restUntil){
    const rem=SESSION.restUntil-Date.now();
    if(rem<=0){SESSION.restUntil=null;render();return}
    const rd=el('restDisplay');if(rd)rd.textContent=fmtClock(rem);
  }
}
function fmtClock(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+pad(s%60)}
function lastSessionDuration(){return S.sessions.length?S.sessions[S.sessions.length-1].seconds:null}
function logExercise(){
  const q=EXDEFS[SESSION.session],ex=q[SESSION.idx];
  SESSION.logged.push({key:ex.key,name:ex.name,weight:SESSION.draft.weight,reps:SESSION.draft.reps});
  S.exerciseLast[ex.key]=SESSION.draft.weight;
  if(ex.key==='squat'){
    const w=SESSION.draft.weight,r=SESSION.draft.reps;
    S.lifts.push({date:TODAY,session:SESSION.session,weight:w,reps:r});
    if(r>=1&&!S.bossesWon.includes(w)&&w<=currentTargetRaw())S.bossesWon.push(w);
  }
  day(TODAY).lift=1;
  SESSION.idx++;
  if(SESSION.idx<q.length){
    SESSION.restUntil=Date.now()+REST_MS;
    SESSION.draft={weight:exDefault(q[SESSION.idx]),reps:0};
  }else{
    SESSION.restUntil=null;
    const secs=Math.round((Date.now()-SESSION.startTs)/1000);
    SESSION.durationSec=secs;
    S.sessions.push({date:TODAY,session:SESSION.session,seconds:secs});
    day(TODAY).workoutSec=secs;
  }
  save();render();
}

function renderWork(){
  if(SESSION){renderSession();return}
  const tgt=currentTarget(),l=lastLift(),ns=nextSession();
  let ladder='';
  for(let w=115;w<=Math.max(235,tgt+20);w+=10){
    const won=S.bossesWon.includes(w),cur=w===tgt;
    ladder+=`<div class="bossrow ${cur?'cur':''} ${won?'won':''}"><span class="nm">${w} lb${w===225?' — old peak':''}</span><span>${won?'Cleared':cur?'Next':''}</span></div>`;
  }
  el('v-work').innerHTML=`
  <div class="card" id="t-worksession"><div class="hdr"><span class="st">${SESSION_LABEL[ns]}</span>${I('lifting')}</div>
    <div class="hint">${ns==='A'?'Squat / Bench / Lat pulldown':'Squat / DB overhead press / Pull-up'}${stalled()?'<br><span class="bad">Stalled twice at '+lastLift().weight+'. Target dropped to 85%.</span>':''} · 30 min budget, 90s rest between lifts.</div>
    <button class="btn gold" id="startsession">Start session</button>
    ${l?`<div class="hint">Last: ${SESSION_LABEL[l.session]} · ${l.weight} lb × ${l.reps}${lastSessionDuration()?' · '+fmtClock(lastSessionDuration()*1000):''}</div>`:''}
  </div>
  <div class="card"><div class="hdr"><span class="st">Squat ladder</span></div>${ladder}</div>`;
}
function renderSession(){
  const q=EXDEFS[SESSION.session];
  let cards='';
  q.forEach((ex,i)=>{
    if(i<SESSION.idx){
      const lg=SESSION.logged[i];
      cards+=`<div class="card"><div class="hdr"><span class="st">${ex.name}</span><span class="ok">Done</span></div>
        <div class="hint">${ex.weighted?lg.weight+' lb × ':''}${lg.reps} reps</div></div>`;
    }else if(i===SESSION.idx){
      const resting=SESSION.restUntil&&SESSION.restUntil>Date.now();
      if(resting){
        cards+=`<div class="card"><div class="hdr"><span class="st">${ex.name}</span><span class="blue">Resting <span id="restDisplay" class="mono">${fmtClock(SESSION.restUntil-Date.now())}</span></span></div>
          <button class="btn sm" id="skiprest">Skip rest</button></div>`;
      }else{
        cards+=`<div class="card"><div class="hdr"><span class="st">${ex.name}</span><span class="goldc">Live</span></div>
          ${ex.weighted?`<div class="split" style="align-items:center">
            <button class="btn sm" data-step="w-">−5</button>
            <div style="flex:1;text-align:center;font-family:var(--mono);font-size:22px">${SESSION.draft.weight} lb</div>
            <button class="btn sm" data-step="w+">+5</button>
          </div><div style="height:8px"></div>`:''}
          <div class="split" style="align-items:center">
            <button class="btn sm" data-step="r-">−1</button>
            <div style="flex:1;text-align:center;font-family:var(--mono);font-size:22px">${SESSION.draft.reps} reps</div>
            <button class="btn sm" data-step="r+">+1</button>
          </div>
          <button class="btn gold" id="logex">Log set</button>
        </div>`;
      }
    }else{
      cards+=`<div class="card" style="opacity:.4"><div class="hdr"><span class="st">${ex.name}</span><span>Up next</span></div></div>`;
    }
  });
  if(SESSION.idx>=q.length){
    cards+=`<div class="card"><div class="hdr"><span class="st">Session complete</span><span class="mono goldc">${fmtClock(SESSION.durationSec*1000)}</span></div>
      <button class="btn gold" id="endsession">End session</button></div>`;
  }
  el('v-work').innerHTML=`
  <div class="card"><div class="hdr"><span class="st">${SESSION_LABEL[SESSION.session]}</span><span id="clockDisplay" class="mono">${fmtClock(Math.max(0,SESSION_MS-(Date.now()-SESSION.startTs)))}</span></div>
    <div class="hint">30 min budget. Overall clock is just pressure, it won't stop you.</div>
    ${SESSION.idx<q.length?'<button class="btn sm" id="endsession">End early</button>':''}
  </div>${cards}`;
}

  window.calM=window.calM??d.getMonth();window.calY=window.calY??d.getFullYear();
  const first=new Date(calY,calM,1),startDow=first.getDay(),days=new Date(calY,calM+1,0).getDate();
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  for(let dd=1;dd<=days;dd++){
    const ds=calY+'-'+pad(calM+1)+'-'+pad(dd);

/* ============ events ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!t)return;
  if(t.dataset.tip){showTip(t.dataset.tip);return}
  if(t.dataset.t){go(t.dataset.t);return}
  if(t.id==='closeSheet'||(t.id==='scrim'&&e.target.id==='scrim')){el('scrim').classList.remove('on');return}

  if(t.dataset.act){
    const x=day(TODAY),k=t.dataset.act;
    if(k==='steps7k'){x.steps=x.steps>=7000?0:7000}
    else if(k==='flask'){
      if(!x.flask&&flasksUsedThisMonth()>=2)return;
      x.flask=x.flask?0:1;
    }
    else x[k]=x[k]?0:1;
    render();return;
  }
  if(t.dataset.dayAct){
    const ds=t.dataset.d,x=day(ds),k=t.dataset.dayAct;
    if(k==='steps7k'){x.steps=x.steps>=7000?0:7000}
    else x[k]=x[k]?0:1;
    render();sheetDay(ds);return;
  }
  if(t.dataset.day){sheetDay(t.dataset.day);return}
  if(t.dataset.cal){calM+=+t.dataset.cal;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}

  if(t.id==='startsession'){startSession();return}
  if(t.id==='logex'){logExercise();return}
  if(t.id==='skiprest'){SESSION.restUntil=Date.now()-1;render();return}
  if(t.id==='endsession'){endSession();return}
  if(t.dataset.step){
    const k=t.dataset.step;
    if(k==='w+')SESSION.draft.weight+=5;
    else if(k==='w-')SESSION.draft.weight=Math.max(0,SESSION.draft.weight-5);
    else if(k==='r+')SESSION.draft.reps+=1;
    else if(k==='r-')SESSION.draft.reps=Math.max(0,SESSION.draft.reps-1);
    renderSession();return;
  }
  if(t.dataset.gtog!=null){S.grocery[+t.dataset.gtog].done=!S.grocery[+t.dataset.gtog].done;render();return}
  if(t.dataset.gdel!=null){S.grocery.splice(+t.dataset.gdel,1);render();return}
  if(t.dataset.batch){const k=t.dataset.batch;S.batch[TODAY]=S.batch[TODAY]||{};S.batch[TODAY][k]=!S.batch[TODAY][k];render();return}
  if(t.id==='gadd'){const v=el('gtext').value.trim();if(!v)return;S.grocery.push({t:v,s:el('gsect').value,done:false});render();return}
  if(t.dataset.odel!=null){S.orders.splice(+t.dataset.odel,1);render();return}
  if(t.id==='oadd'){const pl=el('oplace').value.trim(),or=el('oorder').value.trim();if(!pl||!or)return;S.orders.push({p:pl,o:or});render();return}
  if(t.id==='gclear'){S.grocery=S.grocery.filter(g=>!g.done);render();return}
  if(t.id==='wsaveToday'){const v=parseFloat(el('wtToday').value);if(!isNaN(v)&&v>0){S.weights[TODAY]=v;render()}return}
  if(t.id==='wasave'){const v=parseFloat(el('wa').value);if(!isNaN(v)&&v>0){S.waist[TODAY]=v;render()}return}
  if(t.id==='exp'){
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ng-plus-'+TODAY+'.json';a.click();return;
  }
  if(t.id==='imp'){
    const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{try{S=Object.assign(fresh(),JSON.parse(rd.result));render()}catch(e){alert('Bad file.')}};rd.readAsText(f)};
    i.click();return;
  }
  if(t.id==='resetall'){
    if(confirm('Erase all logged days, weights, lifts and lists? This cannot be undone.')){S=fresh();S.startDate=TODAY;render()}
    return;
  }
});
document.addEventListener('input',e=>{
  const m=e.target.dataset.meal;
  if(m){day(TODAY).meals[m]=e.target.value;save()}
  if(e.target.id==='stepsExact'){
    const v=+e.target.value;if(!isNaN(v)){day(TODAY).steps=v;renderToday();renderHist();save()}
  }
});

const TABS=['today','food','work','hist','stats'];
function go(t){
  tab=t;
  el('pill').style.transform='translateX('+(TABS.indexOf(t)*100)+'%)';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  const m=el('mainScroll');
  m.style.overflowY=(t==='today')?'hidden':'auto';
  m.scrollTop=0;
}
(function(){
  let dragging=false,lastTab=null;
  function pick(x,y){
    const b=document.elementFromPoint(x,y);
    const btn=b&&b.closest('button[data-t]');
    if(btn&&btn.dataset.t!==lastTab){lastTab=btn.dataset.t;go(lastTab)}
  }
  const nv=el('tabs');
  nv.addEventListener('touchstart',e=>{dragging=true;lastTab=tab;const t=e.touches[0];pick(t.clientX,t.clientY)},{passive:true});
  nv.addEventListener('touchmove',e=>{if(!dragging)return;const t=e.touches[0];pick(t.clientX,t.clientY)},{passive:true});
  nv.addEventListener('touchend',()=>{dragging=false});
})();
day(TODAY);
render();
go('today');

/* ============ guided tour ============ */
const TOUR=[
 {t:'today',id:'t-weigh',h:'Weigh In','b':'Check this before you play, like glancing at your rank before a match. 7-day average is what matters, one day is just water. Weight rank is a separate reference scale, it doesn\'t touch your LP.'},
 {t:'today',id:'t-rank',h:'The rank','b':'Your real progression. S-Tier, Autopilot, or Loss, every day. 100 LP promotes a division, a Loss can demote you. Tap the "i" on any card for the full rule.'},
 {t:'today',id:'t-floor',h:'The Floor','b':'2,000 steps, home lunch, home dinner. Hit all three for Autopilot. Add a lift session and 7,000+ steps for S-Tier.'},
 {t:'today',id:'t-flask',h:'Loss Mitigated','b':'Two per month. Use one on a genuinely bad day to zero out the LP hit and keep your streak. Not for planned days.'},
 {t:'food',id:'t-kitchen',h:'Food tab','b':'Kitchen rules track the decision, not the food. Meal log is just a note. Batch cook covers Sunday prep, grocery list and standing orders live here too.'},
 {t:'work',id:'t-worksession',h:'Lift tab','b':'Start a session for a 30-minute clock and a 90-second rest timer between lifts. Squat ladder tracks itself underneath.'},
 {t:'hist',id:'t-cal',h:'Matches','b':'Every day, color-coded. Tap any day to edit it, useful for backfilling.'},
 {t:'stats',id:'t-weight',h:'Rank tab','b':'Weight trend, waist, the full ladder, and Reset Account for export, import, or wiping everything.'}
];
let tourI=0,tourHLel=null;
function tourStep(){
  const s=TOUR[tourI];
  go(s.t);
  if(tourHLel)tourHLel.classList.remove('tour-hl');
  tourHLel=el(s.id);
  if(tourHLel){
    tourHLel.classList.add('tour-hl');
    tourHLel.scrollIntoView({behavior:'smooth',block:'center'});
  }
  el('sheet').innerHTML=`<div class="grip"></div><div class="tiptitle">${s.h}</div><div class="tipbody">${s.b}</div>
    <div class="split" style="margin-top:14px">
      ${tourI<TOUR.length-1?'<button class="btn sm" id="tourSkip">Skip</button>':''}
      <button class="btn gold" id="tourNext">${tourI<TOUR.length-1?'Next':'Done'}</button>
    </div>`;
  el('scrim').classList.add('on');
}
function tourEnd(){
  if(tourHLel){tourHLel.classList.remove('tour-hl');tourHLel=null}
  el('scrim').classList.remove('on');
}
el('tourBtn').addEventListener('click',()=>{tourI=0;tourStep()});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='tourNext'){tourI++;if(tourI>=TOUR.length){tourEnd();return}tourStep()}
  if(t.id==='tourSkip'){tourEnd()}
});
addEventListener('visibilitychange',()=>{if(!document.hidden&&iso(new Date())!==TODAY)location.reload()});
addEventListener('focus',()=>{if(iso(new Date())!==TODAY)location.reload()});
</script>
