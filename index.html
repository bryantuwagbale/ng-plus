<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>New Gains+</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"New Gains%2B","short_name":"NG%2B","display":"standalone","background_color":"%230E1116","theme_color":"%230E1116","start_url":"."}'>
<style>
:root{
  --ink:#0E1116; --panel:#161B22; --panel2:#1B222B; --line:#252D38;
  --bone:#E6E9EC; --ash:#8B95A1; --dim:#5B6673;
  --gold:#C9A227; --goldsoft:#E0BE4A; --golddim:#4A3F17;
  --jade:#4E8C6A; --blood:#9E3535; --flask:#4A7FB5;
  --r:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);
  font-size:15px;line-height:1.35;overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}

#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:10px 14px 8px;-webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block}

/* ---- type ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h2{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);color:var(--ash);font-weight:500}

/* ---- readout (signature) ---- */
.readout{padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.rune-line{display:flex;align-items:baseline;gap:8px}
.rune-big{font-family:var(--mono);font-size:44px;line-height:1;font-weight:600;color:var(--gold);letter-spacing:-.04em}
.rune-unit{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--golddim);color:#8A7526}
.ceil{display:flex;gap:3px;margin-top:9px}
.ceil i{flex:1;height:3px;background:var(--line);border-radius:2px}
.ceil i.f{background:var(--gold)}
.ceil i.l{background:var(--goldsoft)}
.meta{display:flex;gap:0;margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.meta div{flex:1;min-width:0}
.meta .v{font-family:var(--mono);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--jade)}.bad{color:var(--blood)}.gold{color:var(--gold)}.blue{color:var(--flask)}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:10px}
.card.floor{border-color:#2E3745}
.card.floor.done{border-color:#2F5942;background:linear-gradient(180deg,#16241C,#161B22 60%)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hdr .st{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ash)}

/* ---- rows ---- */
.row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:none}
.box{width:19px;height:19px;flex:0 0 19px;border:1.5px solid #3A4553;border-radius:5px;position:relative;transition:.12s}
.row.on .box{background:var(--jade);border-color:var(--jade)}
.row.on .box::after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;border:solid #0E1116;border-width:0 2px 2px 0;transform:rotate(42deg)}
.row .lbl{flex:1;min-width:0}
.row .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
.row .val{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.02em}
.row.on .val{color:var(--gold)}
.row:disabled{opacity:.35}

/* ---- generic ---- */
.btn{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone);margin-top:8px}
.btn.gold{border-color:#6B5A1E;color:var(--goldsoft);background:#1E1A0E}
.btn.sm{width:auto;padding:7px 11px;margin:0;font-size:11px}
.btn:disabled{opacity:.32}
.split{display:flex;gap:8px}.split>*{flex:1}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0B0E13;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
textarea{resize:none;font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:none}
.kv .n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- tabs ---- */
nav{display:flex;border-top:1px solid var(--line);background:#0B0E13;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
nav button.on{color:var(--gold)}
nav button span{display:block;font-size:17px;line-height:1;margin-bottom:4px;filter:grayscale(1) opacity(.55)}
nav button.on span{filter:none}

/* ---- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{text-align:center;font-family:var(--mono);font-size:9px;color:var(--dim);padding-bottom:2px}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--panel);font-family:var(--mono);gap:1px}
.cal button.pad{border:none;background:none}
.cal button .d{font-size:11px;color:var(--ash)}
.cal button .r{font-size:9px;color:var(--dim)}
.cal button.earn{background:#1E1A0E;border-color:#54471A}.cal button.earn .r{color:var(--goldsoft)}
.cal button.floor{background:#16241C;border-color:#2F5942}.cal button.floor .r{color:var(--jade)}
.cal button.dead{background:#231315;border-color:#5C2626}.cal button.dead .r{color:#C05656}
.cal button.flask{background:#121C26;border-color:#2C4C69}.cal button.flask .r{color:var(--flask)}
.cal button.today{outline:1.5px solid var(--gold);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.7);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--panel);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto}
.grip{width:34px;height:4px;background:#333C48;border-radius:2px;margin:0 auto 11px}

/* ---- misc ---- */
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ash)}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:10px 0 3px}
.sect:first-child{margin-top:0}
.gi{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
.gi.on span{text-decoration:line-through;color:var(--dim)}
.gi span{flex:1}
.x{color:var(--dim);font-family:var(--mono);padding:0 4px}
.bossrow{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px}
.bossrow.cur{color:var(--gold)}
.bossrow.won{color:var(--dim);text-decoration:line-through}
.bossrow .nm{font-family:var(--sans);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main>
    <section id="v-today" class="view on"></section>
    <section id="v-food" class="view"></section>
    <section id="v-work" class="view"></section>
    <section id="v-hist" class="view"></section>
    <section id="v-stats" class="view"></section>
  </main>
  <nav id="tabs">
    <button data-t="today" class="on"><span>◉</span>Today</button>
    <button data-t="food"><span>◧</span>Food</button>
    <button data-t="work"><span>▤</span>Workouts</button>
    <button data-t="hist"><span>▦</span>History</button>
    <button data-t="stats"><span>◈</span>Stats</button>
  </nav>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ storage ============ */
const KEY='ngplus.v3';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return mem}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}
}
const DEF={
  days:{},            // 'YYYY-MM-DD': day
  weights:{},         // date: lbs
  waist:{},           // 'YYYY-MM': in
  grocery:[],         // {t,s,done}
  lifts:[],           // {date,session,weight,reps}
  level:1, spent:0,
  stats:{vigor:1,endurance:1,strength:1,discipline:1},
  bossesWon:[],
  batch:{}            // 'YYYY-MM-DD'(sunday): true
};
let S=Object.assign({},DEF,load()||{});
S.stats=Object.assign({vigor:1,endurance:1,strength:1,discipline:1},S.stats||{});

/* ============ dates ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TODAY=iso(new Date());
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=n=>n.toLocaleString('en-US');
const isSunday=s=>parse(s).getDay()===0;

/* ============ day model ============ */
function blank(){return{s2k:0,protein:0,dinner:0,s7k:0,s10k:0,lift:0,lunchMade:0,flask:0,boss:0,meals:{b:'',l:'',d:''}}}
function day(d){if(!S.days[d])S.days[d]=blank();const x=S.days[d];if(!x.meals)x.meals={b:'',l:'',d:''};return x}
function has(d){return !!S.days[d]}

const stepMin=()=>2000+500*(S.stats.vigor-1);
const weekSteps=()=>[49,55,60,65,70][Math.min(S.stats.endurance-1,4)]*1000;
const liftsWeek=()=>1+S.stats.strength;
const RULES=['Dinner plated in the kitchen','No seconds','Snacks portioned into bags on shopping day','Nothing eaten standing at the counter'];
const rules=()=>RULES.slice(0,S.stats.discipline);

function floorDone(x){return (x.s2k||x.s7k||x.s10k)&&x.protein&&x.dinner}
function floorCount(x){return (x.s2k||x.s7k||x.s10k?1:0)+(x.protein?1:0)+(x.dinner?1:0)}
function runes(x){
  if(!x)return 0;let r=0;
  if(floorDone(x))r+=100;
  if(x.s10k)r+=200;else if(x.s7k)r+=100;
  if(x.lift)r+=300;
  if(x.lunchMade)r+=100;
  if(x.dinner)r+=100;
  if(x.boss)r+=500;
  return r;
}
function routine(x){return runes(x)-(x&&x.boss?500:0)}

/* ============ ledger: pool, cache, streak ============ */
function ledger(){
  const keys=Object.keys(S.days).sort();
  if(!keys.length)return{pool:-S.spent,cache:0,cacheLost:0,streak:0,dead:false};
  let cur=keys[0],pool=0,cache=0,lost=0,prevZero=false;
  const end=TODAY;
  while(cur<=end){
    const x=S.days[cur],r=runes(x),z=(r===0&&!(x&&x.flask))&&cur<end;
    if(cache&&x&&floorDone(x)){pool+=cache;cache=0}
    pool+=r;
    if(z){
      if(prevZero){cache=0;lost++}
      else{cache=pool;pool=0}
      prevZero=true;
    }else if(cur<end){prevZero=false}
    cur=shift(cur,1);
  }
  // streak: consecutive days back from today (today counts only if scored)
  let st=0,c=TODAY;
  if(runes(S.days[TODAY])===0&&!(S.days[TODAY]&&S.days[TODAY].flask))c=shift(TODAY,-1);
  while(true){const x=S.days[c];if(!x)break;if(runes(x)>0||x.flask){st++;c=shift(c,-1)}else break}
  return{pool:pool-S.spent,cache,cacheLost:lost,streak:st};
}
const cost=lv=>1500+500*(lv-2);
const nextCost=()=>cost(S.level+1);

/* ============ flasks ============ */
function flasksUsed(){
  const m=TODAY.slice(0,7);
  return Object.keys(S.days).filter(d=>d.slice(0,7)===m&&S.days[d].flask).length;
}

/* ============ bosses ============ */
const LADDER=[{w:135,n:'First Plate'},{w:155,n:'The Wall of Habit'},{w:185,n:'Old Ground'},{w:205,n:'The Approach'},{w:225,n:'Two Plates'}];
function lastLift(){return S.lifts.length?S.lifts[S.lifts.length-1]:null}
function nextSession(){const l=lastLift();return l&&l.session==='A'?'B':'A'}
function currentBoss(){
  const l=lastLift();
  if(!l)return 115;
  const stall=stalled();
  return stall?Math.round(l.weight*.85/5)*5:l.weight+10;
}
function stalled(){
  const n=S.lifts.length;
  return n>=2&&S.lifts[n-1].weight===S.lifts[n-2].weight;
}
function bossName(w){const b=LADDER.find(b=>b.w===w);return b?b.n:null}

/* ============ weight ============ */
function avg7(offset){
  let sum=0,n=0;
  for(let i=offset;i<offset+7;i++){const d=shift(TODAY,-i);if(S.weights[d]!=null){sum+=S.weights[d];n++}}
  return n?{v:sum/n,n}:null;
}
function weekRunes(off){
  // week = Sunday..Saturday; off 0 = current week
  const d=parse(TODAY);const sun=shift(TODAY,-d.getDay()-7*off);
  let t=0;for(let i=0;i<7;i++){t+=runes(S.days[shift(sun,i)])}
  return t;
}

/* ============ render ============ */
let tab='today';
const el=id=>document.getElementById(id);
function render(){
  el('v-today').innerHTML=vToday();
  el('v-food').innerHTML=vFood();
  el('v-work').innerHTML=vWork();
  el('v-hist').innerHTML=vHist();
  el('v-stats').innerHTML=vStats();
  save();
}

/* ---------- TODAY ---------- */
function vToday(){
  const x=day(TODAY),L=ledger(),r=runes(x),done=floorDone(x);
  const ceilMax=x.lift?800:500,cap=routine(x);
  const on=[floorDone(x),x.s7k||x.s10k,x.s10k,x.lunchMade,x.dinner,x.lift];
  const blocks=on.map((f,i)=>`<i class="${f?(i===5?'l':'f'):''}" style="${i===5?'flex:3':''}"></i>`).join('');
  const cacheTxt=L.cache?`<span class="bad">${fmt(L.cache)} dropped</span>`:'<span class="ok">safe</span>';
  const boss=currentBoss(),bn=bossName(boss);
  const flasksLeft=2-flasksUsed();
  const canFlask=r===0&&!x.flask&&flasksLeft>0;

  return `
  <div class="readout">
    <div class="eyebrow">Today &middot; ${parse(TODAY).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div>
    <div class="rune-line"><div class="rune-big num">${r?'+'+fmt(r):'0'}</div><div class="rune-unit">runes / ${ceilMax} ceiling</div></div>
    <div class="ceil">${blocks}</div>
    <div class="meta">
      <div><div class="eyebrow">Banked</div><div class="v gold">${fmt(L.pool)}<span style="color:var(--dim)"> / ${fmt(nextCost())}</span></div></div>
      <div><div class="eyebrow">Cache</div><div class="v">${cacheTxt}</div></div>
      <div><div class="eyebrow">Streak</div><div class="v">${L.streak}</div></div>
      <div><div class="eyebrow">Boss</div><div class="v">${boss}</div></div>
    </div>
  </div>

  ${L.cache?`<div class="card" style="border-color:#5C2626;background:#1A1215">
    <div class="hdr"><b>Behind. Just farm.</b><span class="st bad">${fmt(L.cache)} in cache</span></div>
    <div class="hint" style="color:var(--ash)">Hit the Floor today and the cache returns in full. Miss again and it is gone.</div>
  </div>`:''}

  ${isSunday(TODAY)?`<div class="card" style="border-color:#54471A">
    <div class="hdr"><b>Rest Site</b><span class="st">Sunday</span></div>
    <div class="hint" style="color:var(--ash)">Weekly review, level up, grocery list, five lunches.</div>
    <button class="btn" data-go="stats">Open review</button>
  </div>`:''}

  <div class="card floor ${done?'done':''}">
    <div class="hdr"><b>Floor: minimum day</b>
      <span class="st ${done?'ok':''}">${done?'Complete &middot; +100':floorCount(x)+' of 3'}</span></div>
    ${row('s2k',fmt(stepMin())+' steps','','',x.s2k||x.s7k||x.s10k,x.s7k||x.s10k)}
    ${row('protein','Protein at lunch','','',x.protein)}
    ${row('dinner','Dinner plated in the kitchen','','',x.dinner)}
    <div class="hint">${done?'A Floor day is a full success, not a partial one.':'All three is the entire plan on a bad day.'}</div>
  </div>

  <div class="card">
    <div class="hdr"><b>Runes</b><span class="st">${fmt(cap)} / ${ceilMax}</span></div>
    ${row('s7k','7,000 steps','','+100',x.s7k||x.s10k,!!x.s10k)}
    ${row('s10k','10,000 steps','','+200',x.s10k)}
    ${row('lift','Lift session logged','Log the top set on Workouts','+300',x.lift,true)}
    ${row('lunchMade','Lunch was already made','Not a takeout decision','+100',x.lunchMade)}
    ${row('dinner','Dinner plated in the kitchen','Portion at the counter, rest away','+100',x.dinner)}
  </div>

  ${canFlask?`<button class="btn" data-flask="${TODAY}" style="border-color:#2C4C69;color:var(--flask)">Spend flask &middot; ${flasksLeft} left</button>`:''}
  ${x.flask?`<div class="card" style="border-color:#2C4C69"><b class="blue">Flask spent.</b> <span class="hint" style="display:inline">Counts as a Floor day. Cache and streak intact.</span></div>`:''}
  `;
}
function row(k,lbl,sub,val,on,dis){
  return `<button class="row ${on?'on':''}" data-k="${k}" data-d="${TODAY}" ${dis?'disabled':''}>
    <span class="box"></span>
    <span class="lbl">${lbl}${sub?`<span class="sub">${sub}</span>`:''}</span>
    <span class="val">${val||''}</span></button>`;
}

/* ---------- FOOD ---------- */
const SECTIONS=['Produce','Meat & Seafood','Dairy','Frozen','Pantry','Other'];
function vFood(){
  const x=day(TODAY);
  const bySect={};S.grocery.forEach((g,i)=>{(bySect[g.s]=bySect[g.s]||[]).push([g,i])});
  const sun=shift(TODAY,-parse(TODAY).getDay());
  return `
  <h2>Today's meals</h2>
  <div class="card">
    <div class="eyebrow">Breakfast</div>
    <input type="text" data-meal="b" value="${esc(x.meals.b)}" placeholder="Eggs and sausage" style="margin:4px 0 10px">
    <div class="eyebrow">Lunch</div>
    <input type="text" data-meal="l" value="${esc(x.meals.l)}" placeholder="What you ate" style="margin:4px 0 10px">
    <div class="eyebrow">Dinner</div>
    <input type="text" data-meal="d" value="${esc(x.meals.d)}" placeholder="What you ate" style="margin:4px 0 0">
  </div>

  <h2>Rules</h2>
  <div class="card">
    ${row('lunchMade','Lunch was already made','Leftovers count, wherever they came from','+100',x.lunchMade)}
    ${row('protein','Protein at lunch','Floor item','',x.protein)}
    ${row('dinner','Dinner plated in the kitchen','Portion at the counter, rest put away, nothing at the table','+100',x.dinner)}
    ${S.stats.discipline>1?`<div class="hint">Also in effect: ${rules().slice(1).join(' &middot; ')}</div>`:''}
  </div>

  <h2>Sunday batch</h2>
  <div class="card">
    <button class="row ${S.batch[sun]?'on':''}" data-batch="${sun}">
      <span class="box"></span>
      <span class="lbl">Five portioned lunches, 40g protein<span class="sub">Instant Pot, cooking for two, one Kroger shop</span></span>
    </button>
  </div>

  <h2>Grocery list</h2>
  <div class="card">
    <div class="split">
      <input type="text" id="gtext" placeholder="Add item">
      <select id="gsect" style="flex:0 0 42%">${SECTIONS.map(s=>`<option>${s}</option>`).join('')}</select>
    </div>
    <button class="btn sm" id="gadd" style="margin-top:8px">Add</button>
    ${S.grocery.length?SECTIONS.filter(s=>bySect[s]).map(s=>`
      <div class="sect">${s}</div>
      ${bySect[s].map(([g,i])=>`<div class="gi ${g.done?'on':''}">
        <button class="box" data-gtog="${i}" aria-label="toggle"></button>
        <span>${esc(g.t)}</span><button class="x" data-gdel="${i}">&times;</button></div>`).join('')}
    `).join(''):'<div class="hint">Empty. Build it Sunday, shop once.</div>'}
    ${S.grocery.length?`<button class="btn sm" id="gclear" style="margin-top:10px">Clear checked</button>`:''}
  </div>`;
}

/* ---------- WORKOUTS ---------- */
function vWork(){
  const l=lastLift(),next=nextSession(),boss=currentBoss(),stall=stalled();
  const won=S.bossesWon;
  return `
  <h2>Next session</h2>
  <div class="card">
    <div class="hdr"><b style="font-size:22px" class="num">Session ${next}</b>
      <span class="tag">${l?'Last: '+l.session+' &middot; '+l.date.slice(5):'First session'}</span></div>
    <div class="kv"><span>Target</span><span class="n gold">${boss} &times; 3</span></div>
    <div class="kv"><span>Last top set</span><span class="n">${l?l.weight+' &times; '+l.reps:'&mdash;'}</span></div>
    <div class="kv"><span>Sessions this week</span><span class="n">${liftsThisWeek()} / ${liftsWeek()}</span></div>
    ${stall?`<div class="hint" style="color:#C05656">Stalled twice at ${l.weight}. Drop to ${boss} and climb back. Stalling is not death.</div>`:''}
  </div>

  <h2>Log top set</h2>
  <div class="card">
    <div class="split">
      <div><div class="eyebrow">Weight</div><input type="number" id="lw" inputmode="numeric" value="${boss}"></div>
      <div><div class="eyebrow">Reps</div><input type="number" id="lr" inputmode="numeric" value="3"></div>
    </div>
    <div class="split" style="margin-top:8px">
      <button class="btn gold" data-log="A" style="margin:0">Log as A</button>
      <button class="btn gold" data-log="B" style="margin:0">Log as B</button>
    </div>
    <div class="hint">Logging pays +300. Clearing a named boss pays +500.</div>
  </div>

  <h2>Boss ladder</h2>
  <div class="card">
    ${LADDER.map(b=>`<div class="bossrow ${won.includes(b.w)?'won':(boss>=b.w-9&&boss<=b.w?'cur':'')}">
      <span class="nm">${b.n}</span><span>${b.w}</span></div>`).join('')}
    <div class="hint">Restart at 115, +10 per session while it moves. 225 is a rematch.</div>
  </div>`;
}
function liftsThisWeek(){
  const sun=shift(TODAY,-parse(TODAY).getDay());
  return S.lifts.filter(l=>l.date>=sun&&l.date<=TODAY).length;
}

/* ---------- HISTORY ---------- */
let calM=new Date().getMonth(),calY=new Date().getFullYear();
function vHist(){
  const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate();
  let cells='';
  for(let i=0;i<first.getDay();i++)cells+='<button class="pad" disabled></button>';
  for(let d=1;d<=days;d++){
    const k=calY+'-'+pad(calM+1)+'-'+pad(d),x=S.days[k],r=runes(x);
    let c='';
    if(x&&x.flask)c='flask';
    else if(r>=200)c='earn';
    else if(r>0)c='floor';
    else if(x&&k<TODAY)c='dead';
    cells+=`<button data-day="${k}" class="${c} ${k===TODAY?'today':''}">
      <span class="d">${d}</span><span class="r">${r?r:(c==='flask'?'F':(c==='dead'?'0':''))}</span></button>`;
  }
  return `
  <div class="hdr">
    <button class="btn sm" data-cal="-1">&larr;</button>
    <b class="num">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b>
    <button class="btn sm" data-cal="1">&rarr;</button>
  </div>
  <div class="cal">${'SMTWTFS'.split('').map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <div class="legend eyebrow">
    <span><i style="background:#54471A"></i>Runes</span>
    <span><i style="background:#2F5942"></i>Floor</span>
    <span><i style="background:#5C2626"></i>Death</span>
    <span><i style="background:#2C4C69"></i>Flask</span>
  </div>
  <div class="hint">Tap any day to backfill or correct it.</div>`;
}
function sheetDay(k){
  const x=day(k),r=runes(x),flasksLeft=2-flasksUsed();
  const R=(kk,l,s,v,on,dis)=>`<button class="row ${on?'on':''}" data-k="${kk}" data-d="${k}" ${dis?'disabled':''}>
    <span class="box"></span><span class="lbl">${l}${s?`<span class="sub">${s}</span>`:''}</span><span class="val">${v||''}</span></button>`;
  el('sheet').innerHTML=`<div class="grip"></div>
    <div class="hdr"><b>${parse(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</b>
      <span class="st gold num">${r?'+'+fmt(r):'0'} runes</span></div>
    <div class="card" style="margin:0 0 10px">
      ${R('s2k',fmt(stepMin())+' steps','Floor','',x.s2k||x.s7k||x.s10k,x.s7k||x.s10k)}
      ${R('protein','Protein at lunch','Floor','',x.protein)}
      ${R('dinner','Dinner plated in the kitchen','Floor','+100',x.dinner)}
      ${R('s7k','7,000 steps','','+100',x.s7k||x.s10k,!!x.s10k)}
      ${R('s10k','10,000 steps','','+200',x.s10k)}
      ${R('lift','Lift session','','+300',x.lift)}
      ${R('lunchMade','Lunch was already made','','+100',x.lunchMade)}
    </div>
    ${r===0&&flasksLeft>0||x.flask?`<button class="btn" data-flask="${k}" style="border-color:#2C4C69;color:var(--flask)">
      ${x.flask?'Undo flask':'Spend flask &middot; '+flasksLeft+' left'}</button>`:''}
    <button class="btn" id="closeSheet">Done</button>`;
  el('scrim').classList.add('on');
}

/* ---------- STATS ---------- */
function vStats(){
  const L=ledger(),a=avg7(0),b=avg7(7),d=(a&&b)?b.v-a.v:null;
  const wk=weekRunes(0),lw=weekRunes(1);
  const m=TODAY.slice(0,7);
  const afford=L.pool>=nextCost();
  const st=S.stats,capd=(k)=>(k==='strength'||k==='endurance')&&st[k]>=st.vigor+1;
  const btn=(k,lbl)=>`<button class="btn sm" data-lvl="${k}" ${(!afford||capd(k))?'disabled':''}>${lbl}</button>`;
  return `
  <h2>Weight</h2>
  <div class="card">
    <div class="split"><input type="number" step="0.1" id="wt" inputmode="decimal" placeholder="${S.weights[TODAY]!=null?S.weights[TODAY]:'lbs today'}">
      <button class="btn sm" id="wsave" style="flex:0 0 32%">Save</button></div>
    <div class="kv" style="margin-top:8px"><span>7-day average</span><span class="n">${a?a.v.toFixed(1)+' lb':'&mdash;'}</span></div>
    <div class="kv"><span>Prior 7-day</span><span class="n">${b?b.v.toFixed(1)+' lb':'&mdash;'}</span></div>
    <div class="kv"><span>Change</span><span class="n ${d==null?'':(d>=0.5?'ok':(d<0?'bad':''))}">${d==null?'&mdash;':(d>0?'-':'+')+Math.abs(d).toFixed(1)+' lb'}</span></div>
    <div class="hint">Target 0.5 to 1.0 lb down per week. Single days mean nothing.</div>
  </div>

  <h2>Runes</h2>
  <div class="card">
    <div class="kv"><span>This week</span><span class="n gold">${fmt(wk)}</span></div>
    <div class="kv"><span>Last week</span><span class="n">${fmt(lw)}</span></div>
    <div class="kv"><span>Banked</span><span class="n">${fmt(L.pool)} / ${fmt(nextCost())} to Level ${S.level+1}</span></div>
    ${L.cacheLost?`<div class="kv"><span>Caches lost</span><span class="n bad">${L.cacheLost}</span></div>`:''}
    <div class="hint">${wk>lw?'Beating last week is the only weekly target.':'Behind last week. Just farm.'}</div>
  </div>

  <h2>Level ${S.level}</h2>
  <div class="card">
    <div class="kv"><span>Vigor ${st.vigor}<span class="sub" style="color:var(--dim)"> &middot; floor ${fmt(stepMin())} steps</span></span>${btn('vigor','+1')}</div>
    <div class="kv"><span>Endurance ${st.endurance}<span class="sub" style="color:var(--dim)"> &middot; ${fmt(weekSteps())} steps/wk</span></span>${btn('endurance','+1')}</div>
    <div class="kv"><span>Strength ${st.strength}<span class="sub" style="color:var(--dim)"> &middot; ${liftsWeek()} lifts/wk</span></span>${btn('strength','+1')}</div>
    <div class="kv"><span>Discipline ${st.discipline}<span class="sub" style="color:var(--dim)"> &middot; ${rules().length} kitchen rule${rules().length>1?'s':''}</span></span>${btn('discipline','+1')}</div>
    <div class="hint">${afford?'Spending '+fmt(nextCost())+' banks the runes permanently and raises the requirement.':'Need '+fmt(Math.max(0,nextCost()-L.pool))+' more runes. Consistency stat leads: Strength and Endurance cannot pass Vigor +1.'}</div>
  </div>

  <h2>Waist &middot; ${m}</h2>
  <div class="card">
    <div class="split"><input type="number" step="0.1" id="wa" inputmode="decimal" placeholder="${S.waist[m]!=null?S.waist[m]:'inches at navel'}">
      <button class="btn sm" id="wasave" style="flex:0 0 32%">Save</button></div>
    ${Object.keys(S.waist).sort().reverse().slice(0,3).map(k=>`<div class="kv"><span>${k}</span><span class="n">${S.waist[k]}"</span></div>`).join('')}
  </div>

  <div class="split">
    <button class="btn sm" id="exp" style="flex:1">Export JSON</button>
    <button class="btn sm" id="imp" style="flex:1">Import JSON</button>
  </div>
  <div style="height:14px"></div>`;
}

/* ============ events ============ */
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t],[data-k],[data-flask],[data-day],[data-cal],[data-log],[data-lvl],[data-gtog],[data-gdel],[data-batch],[data-go],#gadd,#gclear,#wsave,#wasave,#exp,#imp,#closeSheet,#scrim');
  if(!t)return;

  if(t.dataset.t||t.dataset.go){go(t.dataset.t||t.dataset.go);return}

  if(t.dataset.k){
    const x=day(t.dataset.d),k=t.dataset.k;
    x[k]=x[k]?0:1;
    if(k==='s10k'&&x.s10k)x.s7k=0;
    if((k==='s7k'||k==='s10k')&&(x.s7k||x.s10k))x.s2k=1;
    afterEdit(t.dataset.d);return;
  }
  if(t.dataset.flask){
    const k=t.dataset.flask,x=day(k);
    if(!x.flask&&flasksUsed()>=2)return;
    x.flask=x.flask?0:1;afterEdit(k);return;
  }
  if(t.dataset.day){sheetDay(t.dataset.day);return}
  if(t.dataset.cal){calM+=+t.dataset.cal;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}
  if(t.id==='closeSheet'||(t.id==='scrim'&&e.target.id==='scrim')){el('scrim').classList.remove('on');return}
  if(t.id==='scrim')return;

  if(t.dataset.log){
    const w=+el('lw').value,r=+el('lr').value;
    if(!w||!r)return;
    S.lifts.push({date:TODAY,session:t.dataset.log,weight:w,reps:r});
    day(TODAY).lift=1;
    const b=LADDER.find(b=>b.w===w);
    if(b&&!S.bossesWon.includes(w)&&r>=1){S.bossesWon.push(w);day(TODAY).boss=1}
    render();return;
  }
  if(t.dataset.lvl){
    const k=t.dataset.lvl;
    S.spent+=nextCost();S.level++;S.stats[k]++;render();return;
  }
  if(t.dataset.gtog!=null){S.grocery[+t.dataset.gtog].done=!S.grocery[+t.dataset.gtog].done;render();return}
  if(t.dataset.gdel!=null){S.grocery.splice(+t.dataset.gdel,1);render();return}
  if(t.dataset.batch){const k=t.dataset.batch;S.batch[k]=!S.batch[k];render();return}
  if(t.id==='gadd'){
    const v=el('gtext').value.trim();if(!v)return;
    S.grocery.push({t:v,s:el('gsect').value,done:false});render();
    const i=el('gtext');if(i){i.focus()}return;
  }
  if(t.id==='gclear'){S.grocery=S.grocery.filter(g=>!g.done);render();return}
  if(t.id==='wsave'){const v=parseFloat(el('wt').value);if(!isNaN(v)){S.weights[TODAY]=v;render()}return}
  if(t.id==='wasave'){const v=parseFloat(el('wa').value);if(!isNaN(v)){S.waist[TODAY.slice(0,7)]=v;render()}return}
  if(t.id==='exp'){
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ng-plus-'+TODAY+'.json';a.click();return;
  }
  if(t.id==='imp'){
    const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
      rd.onload=()=>{try{S=Object.assign({},DEF,JSON.parse(rd.result));render()}catch(e){alert('Bad file.')}};rd.readAsText(f)};
    i.click();return;
  }
});
document.addEventListener('input',e=>{
  const m=e.target.dataset.meal;
  if(m){day(TODAY).meals[m]=e.target.value;save()}
});
function afterEdit(d){
  const openSheet=el('scrim').classList.contains('on');
  render();
  if(openSheet)sheetDay(d);
}
function go(t){
  tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelector('main').scrollTop=0;
}
day(TODAY);
render();
</script>
</body>
</html>
